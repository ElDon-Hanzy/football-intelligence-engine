<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Football Intelligence</title><style>*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:#07111f;color:#eaf2ff;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{width:100%;max-width:1100px;margin:auto;padding:18px;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}.muted,small{color:#8fa6c4}h1{font-size:22px;margin:0}h2{font-size:16px;margin:22px 0 10px}.pill,select,input,.tab{background:#12233a;color:#eaf2ff;border:1px solid #223b5b;border-radius:10px;padding:8px 10px;font-size:12px}.tabs{display:flex;gap:8px;margin-top:14px;max-width:100%;overflow:auto}.tab{cursor:pointer;white-space:nowrap}.tab.active{background:#1d3858;border-color:#4b77a8}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}.card,.panel,.betcard{background:#0e1b2d;border:1px solid #1c3554;border-radius:14px;padding:13px;min-width:0}.card b{font-size:20px;display:block;margin-top:4px}.betgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.betcard{cursor:pointer}.betcard strong{display:block;font-size:22px;margin:5px 0}.green{color:#5ee6a8}.amber{color:#ffd166}.red{color:#ff6b6b}.player{background:#151d2b;border:1px solid #293b53;border-radius:11px;padding:9px;cursor:pointer;min-width:145px}.player span{font-size:10px;color:#86cab0;display:block}.player b{display:block;font-size:13px;margin:2px 0}.player small{font-size:10px}.bench{display:flex;gap:8px;overflow:auto;max-width:100%}.tablewrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}table{width:100%;max-width:100%;table-layout:fixed;border-collapse:collapse;background:#0e1b2d;font-size:11px}th,td{padding:8px 4px;border-bottom:1px solid #182e49;text-align:right;overflow:hidden;text-overflow:ellipsis}th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal;word-break:break-word}td small{display:block;font-size:8px;margin-top:2px;white-space:normal}.clickrow{cursor:pointer}.clickrow:hover{background:#12233a}.okrow{background:rgba(94,230,168,.035)}.badrow{background:rgba(255,107,107,.04)}.toolbar{display:flex;gap:8px;align-items:center}.metric{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #182e49}.metric:last-child{border-bottom:0}.tag{display:inline-block;padding:3px 7px;border:1px solid #2a4666;border-radius:999px;font-size:10px;margin:2px 4px 2px 0}.status{display:inline-block;padding:3px 7px;border-radius:999px;font-size:10px;background:#302515;color:#ffd98c;border:1px solid #5d4821}.modal{display:none;position:fixed;inset:0;background:#000a;z-index:50;padding:14px;overflow:auto}.modal.open{display:block}.sheet{max-width:720px;margin:30px auto;background:#0b1727;border:1px solid #294567;border-radius:18px;padding:16px}.close{float:right;background:#172942;color:#fff;border:1px solid #315274;border-radius:10px;padding:6px 9px}.loading{padding:32px 0;color:#8fa6c4}.error{padding:14px;background:#3a1717;border:1px solid #6b2d2d;border-radius:12px;color:#ffb2b2;margin-top:18px}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.filters input{min-width:0;max-width:100%}.legend{font-size:11px;color:#8fa6c4}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 9px}@media(min-width:700px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}table{font-size:12px}th,td{padding:9px 7px}}@media(max-width:520px){.wrap{padding:12px}.widehide{display:none}.overviewTable th:first-child,.overviewTable td:first-child{width:7%}.overviewTable th:nth-child(2),.overviewTable td:nth-child(2){width:30%}.overviewTable th:not(:first-child):not(:nth-child(2)),.overviewTable td:not(:first-child):not(:nth-child(2)){width:auto}.auditOnly,.betOnly{overflow-x:auto}.auditOnly table{min-width:720px;table-layout:auto}.betOnly table{min-width:620px;table-layout:auto}.top{align-items:flex-start}.toolbar{width:100%;justify-content:space-between}.betgrid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>Football Intelligence</h1><div class="muted" id="sub">Loading engine…</div></div><div class="toolbar"><select id="gw"></select><div class="pill" id="stamp">—</div></div></div><div class="tabs"><button id="tabOverview" class="tab">Overview</button><button id="tabBetting" class="tab">Betting</button><button id="tabAudit" class="tab">All Predictions vs Actuals</button></div><div id="app" class="loading">Loading gameweek snapshot…</div></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">Close</button><div id="detail"></div></div></div><script>const API='https://knooiwezzsxcwhtjtdap.supabase.co/functions/v1/fpl-api',BETAPI='https://knooiwezzsxcwhtjtdap.supabase.co/functions/v1/betting-api',pct=v=>(100*Number(v||0)).toFixed(1)+'%',n=v=>Number(v||0),fmt=v=>v==null?'—':Number(v).toFixed(2),qs=new URLSearchParams(location.search),reqGw=Number(qs.get('gw')||0),reqTab=['audit','betting'].includes(qs.get('tab'))?qs.get('tab'):'overview',util=x=>n(x.expected_points)+1.5*n(x.p_10_plus)+4*n(x.p_15_plus)+7*n(x.p_20_plus)+.35*n(x.p_start)+.2*n(x.confidence),confColor=v=>{const p=Math.max(0,Math.min(1,n(v))),d=Math.abs(p-.5)/.5;return p>=.5?`hsl(145 65% ${68-18*d}%)`:`hsl(0 72% ${70-18*d}%)`},actualColor=(actual,pred)=>Math.abs(n(actual)-n(pred))<=Math.max(2,.30*Math.max(0,n(pred)))?'#5ee6a8':'#ff6b6b';let DATA=null,BET=null,ACTIVE=reqTab;function closeModal(){document.getElementById('modal').classList.remove('open')}function setTab(t){ACTIVE=t;const u=new URL(location.href);u.searchParams.set('tab',t);history.replaceState({},'',u);render()}function openPlayer(id){const x=[...(DATA?.squad||[]),...(DATA?.top_double_digit||[]),...(DATA?.all_predictions||[])].find(p=>Number(p.id)===Number(id));if(!x)return;const a=x.actual||null,err=a?n(a.total_points)-n(x.expected_points):null,tol=Math.max(2,.3*n(x.expected_points));document.getElementById('detail').innerHTML=`<h2 style="font-size:22px;margin:0 0 4px">${x.name}</h2><div class="muted">${x.team||'—'} · ${x.position||'—'} · GW${DATA.gameweek}</div><div style="margin:10px 0"><span class="tag">${fmt(x.expected_points)} xPts</span><span class="tag">${pct(x.p_10_plus)} P10+</span><span class="tag">${pct(x.p_15_plus)} P15+</span><span class="tag">${pct(x.p_start)} Start</span></div><div class="panel"><div class="metric"><span>Expected minutes</span><b>${fmt(x.expected_minutes)}</b></div><div class="metric"><span>Goal probability</span><b>${pct(x.p_goal)}</b></div><div class="metric"><span>Assist probability</span><b>${pct(x.p_assist)}</b></div><div class="metric"><span>Clean sheet probability</span><b>${pct(x.p_clean_sheet)}</b></div><div class="metric"><span>Defensive contribution</span><b>${pct(x.p_dc)}</b></div><div class="metric"><span>Bonus probability</span><b>${pct(x.p_bonus)}</b></div><div class="metric"><span>Model confidence</span><b style="color:${confColor(x.confidence)}">${pct(x.confidence)}</b></div>${a?`<div class="metric"><span>Actual points</span><b style="color:${actualColor(a.total_points,x.expected_points)}">${a.total_points}</b></div><div class="metric"><span>Points error</span><b style="color:${Math.abs(err)<=tol?'#5ee6a8':'#ff6b6b'}">${err>0?'+':''}${err.toFixed(2)} <small>(±${tol.toFixed(2)} allowed)</small></b></div><div class="metric"><span>Actual minutes</span><b>${a.minutes}</b></div>`:'<div class="metric"><span>Actual result</span><b class="muted">Pending</b></div>'}</div>`;document.getElementById('modal').classList.add('open')}function openFixture(id){const f=(BET?.fixtures||[]).find(x=>Number(x.match_id)===Number(id));if(!f)return;const scores=(f.top_scorelines||[]).map(x=>`<div class="metric"><span>${x.score}</span><b>${pct(x.prob)}</b></div>`).join(''),hist=(f.history||[]).map((x,i)=>{const rs=(x.reasons||[]).map(r=>r.type==='initial_snapshot'?'Initial pre-kickoff snapshot':`${r.type}: ${r.from} → ${r.to} (${r.delta>0?'+':''}${r.delta})`).join('<br>')||'No material model-input change';return `<div class="metric"><span>${new Date(x.captured_at).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span><span>${x.home_lambda.toFixed(2)}–${x.away_lambda.toFixed(2)}<small>${rs}</small></span></div>`}).join('');document.getElementById('detail').innerHTML=`<h2 style="font-size:22px;margin:0 0 4px">${f.home_team} vs ${f.away_team}</h2><div class="muted">GW${BET.gameweek} · ${new Date(f.kickoff_time).toLocaleString()}</div><div style="margin:10px 0"><span class="tag">xG ${f.home_lambda.toFixed(2)} – ${f.away_lambda.toFixed(2)}</span><span class="tag">Confidence ${pct(f.confidence)}</span><span class="status">${f.frozen?'FROZEN AT KICKOFF':'PRE-KICKOFF'}</span></div><div class="panel"><b>Top correct scores</b>${scores}</div><h2>Main markets</h2><div class="panel"><div class="metric"><span>Match result</span><b>${f.market_picks.match_result.selection} · ${pct(f.market_picks.match_result.prob)}</b></div><div class="metric"><span>O/U 2.5</span><b>${f.market_picks.totals.selection} · ${pct(f.market_picks.totals.prob)}</b></div><div class="metric"><span>BTTS</span><b>${f.market_picks.btts.selection} · ${pct(f.market_picks.btts.prob)}</b></div><div class="metric"><span>Clean sheet</span><b>${f.market_picks.clean_sheet.selection} · ${pct(f.market_picks.clean_sheet.prob)}</b></div></div><h2>Forecast changes</h2><div class="panel">${hist||'<div class="muted">No history yet.</div>'}</div><div class="notice" style="margin-top:12px">Model probability only. Bookmaker odds are not connected yet, so this is not yet a measured value edge.</div>`;document.getElementById('modal').classList.add('open')}function scoreCards(){const a=BET?.homepage_correct_score||[];if(!a.length)return'';return `<h2>Correct Score Recommendations</h2><div class="betgrid">${a.map((f,i)=>`<div class="betcard" onclick="openFixture(${f.match_id})"><small>MODEL PICK ${i+1} · ${f.home_short} vs ${f.away_short}</small><strong>${f.market_picks.correct_score.selection}</strong><div>${pct(f.market_picks.correct_score.prob)} score probability</div><small>xG ${f.home_lambda.toFixed(2)}–${f.away_lambda.toFixed(2)} · confidence ${pct(f.confidence)}</small></div>`).join('')}</div>`}function renderOverview(){const d=DATA,s=d.squad,map=new Map(s.map(x=>[x.id,x]));let xi=(d.decision?.starting_xi||[]).map(x=>map.get(Number(x.id))).filter(Boolean),bench=(d.decision?.bench||[]).map(x=>map.get(Number(x.id))).filter(Boolean),cap=map.get(Number(d.decision?.captain_player_id)),vc=map.get(Number(d.decision?.vice_player_id));const xixp=xi.reduce((z,x)=>z+n(x.expected_points),0),squadxp=s.reduce((z,x)=>z+n(x.expected_points),0);const haul=(d.top_double_digit||[]).map((x,i)=>`<tr class="clickrow" onclick="openPlayer(${x.id})"><td>${i+1}</td><td><b>${x.name}</b><small>${x.team} · ${x.position}</small></td><td><b class="green">${pct(x.p_10_plus)}</b></td><td>${pct(x.p_15_plus)}</td><td>${n(x.expected_points).toFixed(2)}</td><td class="widehide">${n(x.expected_minutes).toFixed(0)}</td><td><b style="color:${confColor(x.confidence)}">${pct(x.confidence)}</b></td></tr>`).join('');const rows=[...s].sort((a,b)=>util(b)-util(a)).map((x,i)=>`<tr class="clickrow" onclick="openPlayer(${x.id})"><td>${i+1}</td><td><b>${x.name}</b><small>${x.team} · ${x.position}</small></td><td>${n(x.expected_minutes).toFixed(0)}</td><td>${n(x.expected_points).toFixed(2)}</td><td>${pct(x.p_10_plus)}</td><td>${pct(x.p_15_plus)}</td><td style="color:${x.actual?actualColor(x.actual.total_points,x.expected_points):'#8fa6c4'}">${x.actual?.total_points??'Pending'}</td></tr>`).join('');return `<div class="cards"><div class="card"><small>Frozen XI xPts</small><b>${xixp.toFixed(2)}</b></div><div class="card"><small>Frozen squad xPts</small><b>${squadxp.toFixed(2)}</b></div><div class="card"><small>Captain / Vice</small><b class="green">${cap?.name||'—'}</b><small>${vc?.name||'—'} vice</small></div><div class="card"><small>Current engine</small><b class="amber">v${d.current_model_version||'—'}</b><small>league-wide haul scan</small></div></div>${scoreCards()}<h2>Top 10 Double-Digit Return Candidates · All 600 Players</h2><div class="muted" style="margin-bottom:8px">Tap any player · ranked by P(10+), then P(15+) and xPts</div><div class="tablewrap"><table class="overviewTable"><thead><tr><th>#</th><th>Player</th><th>P10+</th><th>P15+</th><th>xPts</th><th class="widehide">xMin</th><th>Confidence</th></tr></thead><tbody>${haul||'<tr><td colspan="7">No current-engine run for this GW.</td></tr>'}</tbody></table></div><h2>Squad Prediction vs Actual</h2><div class="tablewrap"><table class="overviewTable"><thead><tr><th>#</th><th>Player</th><th>xMin</th><th>xPts</th><th>P10+</th><th>P15+</th><th>Actual</th></tr></thead><tbody>${rows}</tbody></table></div><h2>Frozen bench</h2><div class="bench">${bench.map((x,i)=>`<div class="player" onclick="openPlayer(${x.id})"><span>${x.position==='GKP'?'GK':'Bench '+(i+1)}</span><b>${x.name}</b><small>${n(x.expected_points).toFixed(2)} xPts · ${pct(x.p_10_plus)} P10+</small></div>`).join('')}</div>`}function renderBetting(){const rec=(BET?.market_recommendations||[]).map(r=>`<div class="betcard" onclick="openFixture(${r.match_id})"><small>${r.label}</small><strong style="font-size:17px">${r.selection}</strong><div>${r.fixture}</div><small>${pct(r.prob)} model probability · confidence ${pct(r.confidence)}</small></div>`).join(''),rows=(BET?.fixtures||[]).map(f=>`<tr class="clickrow" onclick="openFixture(${f.match_id})"><td><b>${f.home_short}–${f.away_short}</b><small>${new Date(f.kickoff_time).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</small></td><td>${f.home_lambda.toFixed(2)}–${f.away_lambda.toFixed(2)}</td><td><b>${f.market_picks.correct_score.selection}</b><small>${pct(f.market_picks.correct_score.prob)}</small></td><td>${f.market_picks.match_result.selection}<small>${pct(f.market_picks.match_result.prob)}</small></td><td>${f.market_picks.totals.selection}<small>${pct(f.market_picks.totals.prob)}</small></td><td>${f.market_picks.btts.selection}<small>${pct(f.market_picks.btts.prob)}</small></td><td>${f.market_picks.clean_sheet.selection}<small>${pct(f.market_picks.clean_sheet.prob)}</small></td><td>${f.frozen?'Frozen':'Live pre-KO'}</td></tr>`).join('');return `<div class="notice">Bookmaker odds are not connected yet. These are <b>probability recommendations</b>, not measured value bets. Edge/EV will activate after odds + de-vig ingestion.</div><h2>Best Model Pick by Market</h2><div class="betgrid">${rec||'<div class="muted">No upcoming pre-kickoff fixtures.</div>'}</div><h2>Fixture Intelligence · GW${BET?.gameweek||DATA.gameweek}</h2><div class="muted" style="margin-bottom:8px">Tap a fixture to see top scorelines, probabilities and the timestamped forecast-change history.</div><div class="tablewrap betOnly"><table><thead><tr><th>Fixture</th><th>xG</th><th>Correct Score</th><th>1X2</th><th>O/U 2.5</th><th>BTTS</th><th>Clean Sheet</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="8">No fixture forecast snapshots yet.</td></tr>'}</tbody></table></div>`}function renderAudit(){const all=DATA.all_predictions||[],played=all.filter(x=>x.actual_status==='final'),ok=played.filter(x=>x.acceptable===true),bad=played.filter(x=>x.acceptable===false),rate=played.length?100*ok.length/played.length:0;const tableRows=all.map((x,i)=>{const a=x.actual,err=x.error,tol=x.tolerance,row=a?(x.acceptable?'okrow':'badrow'):'';return `<tr class="clickrow ${row}" onclick="openPlayer(${x.id})"><td>${i+1}</td><td><b>${x.name}</b><small>${x.team} · ${x.position}</small></td><td>${n(x.expected_points).toFixed(2)}</td><td style="color:${a?(x.acceptable?'#5ee6a8':'#ff6b6b'):'#8fa6c4'}"><b>${a?.total_points??'Pending'}</b></td><td style="color:${a?(x.acceptable?'#5ee6a8':'#ff6b6b'):'#8fa6c4'}">${a?(err>0?'+':'')+Number(err).toFixed(2):'—'}</td><td>${n(tol).toFixed(2)}</td><td>${n(x.expected_minutes).toFixed(0)}</td><td>${a?.minutes??'—'}</td><td><b style="color:${confColor(x.confidence)}">${pct(x.confidence)}</b></td></tr>`}).join('');return `<div class="cards"><div class="card"><small>Predictions</small><b>${all.length}</b></div><div class="card"><small>Completed</small><b>${played.length}</b></div><div class="card"><small>Within tolerance</small><b class="green">${ok.length}</b><small>${rate.toFixed(1)}% of completed</small></div><div class="card"><small>Outside tolerance</small><b class="red">${bad.length}</b></div></div><h2>All Predictions vs Actuals · GW${DATA.gameweek}</h2><div class="filters"><input id="search" placeholder="Search player or team…" oninput="filterAudit(this.value)"><span class="legend"><span class="dot" style="background:#5ee6a8"></span>acceptable <span class="dot" style="background:#ff6b6b"></span>outside margin · tolerance = ±max(2 pts, 30% of xPts)</span></div><div class="tablewrap auditOnly"><table id="auditTable"><thead><tr><th>#</th><th>Player</th><th>xPts</th><th>Actual</th><th>Error</th><th>Allowed</th><th>xMin</th><th>Actual Min</th><th>Confidence</th></tr></thead><tbody>${tableRows}</tbody></table></div>`}function filterAudit(q){q=String(q||'').toLowerCase();document.querySelectorAll('#auditTable tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}function render(){document.getElementById('tabOverview').classList.toggle('active',ACTIVE==='overview');document.getElementById('tabBetting').classList.toggle('active',ACTIVE==='betting');document.getElementById('tabAudit').classList.toggle('active',ACTIVE==='audit');document.getElementById('app').className='';document.getElementById('app').innerHTML=ACTIVE==='audit'?renderAudit():ACTIVE==='betting'?renderBetting():renderOverview()}document.getElementById('tabOverview').onclick=()=>setTab('overview');document.getElementById('tabBetting').onclick=()=>setTab('betting');document.getElementById('tabAudit').onclick=()=>setTab('audit');(async()=>{try{const g=reqGw||1,[r,br]=await Promise.all([fetch(API+(reqGw?'?gw='+reqGw:''),{cache:'no-store'}),fetch(BETAPI+'?gw='+g,{cache:'no-store'})]),d=await r.json(),bd=await br.json();if(!d.ok)throw Error(d.error);DATA=d;BET=bd.ok?bd:{fixtures:[],homepage_correct_score:[],market_recommendations:[],gameweek:d.gameweek};if(!reqGw&&BET.gameweek!==d.gameweek){const rr=await fetch(BETAPI+'?gw='+d.gameweek,{cache:'no-store'});BET=await rr.json()}const sel=document.getElementById('gw');sel.innerHTML=d.available_gameweeks.map(x=>`<option value="${x.gameweek}" ${x.gameweek===d.gameweek?'selected':''}>GW${x.gameweek}</option>`).join('');sel.onchange=()=>{const u=new URL(location.href);u.searchParams.set('gw',sel.value);location.href=u};document.getElementById('sub').textContent=`FPL Engine · frozen v${d.model_version} · current v${d.current_model_version||'—'} · GW${d.gameweek}`;document.getElementById('stamp').textContent=new Date(d.generated_at).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});render()}catch(e){document.getElementById('app').className='error';document.getElementById('app').textContent='Dashboard error: '+e.message}})();</script></body></html>
