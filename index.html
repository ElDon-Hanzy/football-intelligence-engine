<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Football Intelligence</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf2ff;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}.muted,small{color:#8fa6c4}h1{font-size:22px;margin:0}h2{font-size:16px;margin:22px 0 10px}.pill,select{background:#12233a;color:#eaf2ff;border:1px solid #223b5b;border-radius:10px;padding:8px 10px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.card{background:#0e1b2d;border:1px solid #1c3554;border-radius:14px;padding:13px}.card b{font-size:20px;display:block;margin-top:4px}.green{color:#5ee6a8}.amber{color:#ffd166}.pitch{background:linear-gradient(180deg,#123c31,#0d3228);border:1px solid #245c4b;border-radius:18px;padding:13px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.player{background:#0c211bcc;border:1px solid #285b4c;border-radius:11px;padding:9px}.player span{font-size:10px;color:#86cab0;display:block}.player b{display:block;font-size:13px;margin:2px 0}.player small{font-size:10px}.bench{display:flex;gap:8px;overflow:auto}.bench .player{min-width:145px;background:#151d2b;border-color:#293b53}.notice{margin-top:14px;padding:10px 12px;border-radius:10px;background:#302515;border:1px solid #5d4821;color:#ffd98c;font-size:11px}.oknote{margin-top:14px;padding:10px 12px;border-radius:10px;background:#102b24;border:1px solid #245c4b;color:#87e5bf;font-size:11px}table{width:100%;border-collapse:collapse;background:#0e1b2d;border-radius:14px;overflow:hidden;font-size:12px}th,td{padding:9px 7px;border-bottom:1px solid #182e49;text-align:right}th:nth-child(2),td:nth-child(2){text-align:left}td small{display:block;font-size:9px;margin-top:2px}.loading{padding:32px 0;color:#8fa6c4}.error{padding:14px;background:#3a1717;border:1px solid #6b2d2d;border-radius:12px;color:#ffb2b2;margin-top:18px}.actual{color:#5ee6a8}.toolbar{display:flex;gap:8px;align-items:center}@media(min-width:700px){.pitch{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(4,1fr)}}@media(max-width:520px){th:nth-child(6),td:nth-child(6),th:nth-child(8),td:nth-child(8){display:none}}
</style></head><body><div class="wrap"><div class="top"><div><h1>Football Intelligence</h1><div class="muted" id="sub">Loading engine…</div></div><div class="toolbar"><select id="gw"></select><div class="pill" id="stamp">—</div></div></div><div id="app" class="loading">Loading gameweek snapshot…</div></div><script>
const API='https://knooiwezzsxcwhtjtdap.supabase.co/functions/v1/fpl-api', pct=v=>(100*Number(v||0)).toFixed(1)+'%', n=v=>Number(v||0), qs=new URLSearchParams(location.search), reqGw=Number(qs.get('gw')||0);
function card(x,tag=''){const a=x.actual;return `<div class="player"><span>${tag||x.position}</span><b>${x.name}</b><small>${n(x.expected_points).toFixed(2)} xPts · ${pct(x.p_15_plus)} 15+${a?` · <span class="actual">${a.total_points} actual</span>`:''}</small></div>`}
(async()=>{try{const r=await fetch(API+(reqGw?`?gw=${reqGw}`:''),{cache:'no-store'});if(!r.ok)throw new Error('API '+r.status);const d=await r.json();if(!d.ok)throw new Error(d.error||'API error');
 const sel=document.getElementById('gw');sel.innerHTML=d.available_gameweeks.map(x=>`<option value="${x.gameweek}" ${x.gameweek===d.gameweek?'selected':''}>GW${x.gameweek}</option>`).join('');sel.onchange=()=>{location.search='?gw='+sel.value};document.getElementById('sub').textContent=`FPL Engine · v${d.model_version} · GW${d.gameweek} · frozen snapshot`;document.getElementById('stamp').textContent=new Date(d.generated_at).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
 const s=d.squad, map=new Map(s.map(x=>[x.id,x]));let xi=[],bench=[],cap=null,vc=null;if(d.decision){xi=(d.decision.starting_xi||[]).map(x=>map.get(Number(x.id))).filter(Boolean);bench=(d.decision.bench||[]).map(x=>map.get(Number(x.id))).filter(Boolean);cap=map.get(Number(d.decision.captain_player_id));vc=map.get(Number(d.decision.vice_player_id));}if(!xi.length){xi=[...s].sort((a,b)=>n(b.expected_points)-n(a.expected_points)).slice(0,11);bench=s.filter(x=>!xi.some(y=>y.id===x.id));cap=xi[0];vc=xi[1]}
 const ord={GKP:0,DEF:1,MID:2,FWD:3};xi.sort((a,b)=>ord[a.position]-ord[b.position]);const xixp=xi.reduce((z,x)=>z+n(x.expected_points),0),top=[...xi].sort((a,b)=>n(b.p_15_plus)-n(a.p_15_plus))[0],ranked=[...s].sort((a,b)=>n(b.expected_points)-n(a.expected_points));
 const rows=ranked.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.name}</b><small>${x.team} · ${x.position}</small></td><td>${n(x.expected_minutes).toFixed(0)}</td><td><b>${n(x.expected_points).toFixed(2)}</b></td><td class="actual">${x.actual?.total_points??'—'}</td><td>${pct(x.p_10_plus)}</td><td>${pct(x.p_15_plus)}</td><td>${pct(x.p_dc)}</td></tr>`).join('');
 const result=d.result_run?`${d.result_run.is_final?'Final':'Live/partial'} results · ${d.result_run.metadata?.finished_fixtures||0}/${d.result_run.metadata?.fixture_count||10} fixtures finished`:'No results snapshot yet';const audit=d.audit?`MAE pts ${n(d.audit.mae_points).toFixed(2)} · MAE mins ${n(d.audit.mae_minutes).toFixed(1)}${d.audit.calibration?.eligible_for_cumulative_backtest?' · counts in calibration':' · excluded from cumulative calibration'}`:'Audit pending';
 document.getElementById('app').className='';document.getElementById('app').innerHTML=`<div class="cards"><div class="card"><small>XI xPts</small><b>${xixp.toFixed(2)}</b></div><div class="card"><small>Captain</small><b class="green">${cap?.name||'—'}</b><small>${cap?n(cap.expected_points).toFixed(2):'—'} xPts</small></div><div class="card"><small>Vice</small><b>${vc?.name||'—'}</b><small>${vc?n(vc.expected_points).toFixed(2):'—'} xPts</small></div><div class="card"><small>Top haul</small><b class="amber">${top?.name||'—'}</b><small>${top?pct(top.p_15_plus):'—'} 15+</small></div></div>${d.excluded_from_backtest?`<div class="notice">${d.notes||'This snapshot is excluded from predictive backtesting.'}</div>`:''}<div class="oknote">${result}<br>${audit}</div><h2>Frozen model XI</h2><div class="pitch">${xi.map(x=>card(x,x.position+(x.id===cap?.id?' · C':'')+(x.id===vc?.id?' · VC':''))).join('')}</div><h2>Frozen bench</h2><div class="bench">${bench.map((x,i)=>card(x,x.position==='GKP'?'GK':`Bench ${i+1}`)).join('')}</div><h2>Full 15 · prediction vs actual</h2><table><thead><tr><th>#</th><th>Player</th><th>xMin</th><th>xPts</th><th>Actual</th><th>10+</th><th>15+</th><th>DC</th></tr></thead><tbody>${rows}</tbody></table>`;
}catch(e){document.getElementById('app').className='error';document.getElementById('app').textContent='Dashboard error: '+e.message}})();
</script></body></html>
