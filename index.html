<body>
<div class="wrap"><div class="top"><div><h1>Football Intelligence</h1><div class="muted" id="sub">Loading engine…</div></div><div class="toolbar"><select id="gw"></select><div class="pill" id="stamp">—</div></div></div><div class="tabs"><button id="tabOverview" class="tab">Overview</button><button id="tabBetting" class="tab">Betting</button><button id="tabAudit" class="tab">All Predictions vs Actuals</button></div><div id="app" class="loading">Loading gameweek snapshot…</div></div>
<div id="modal" class="modal"><div class="sheet"><button class="close" id="closeModalBtn">Close</button><div id="detail"></div></div></div>
<script>
const API='https://knooiwezzsxcwhtjtdap.supabase.co/functions/v1/fpl-api';
const BETAPI='https://knooiwezzsxcwhtjtdap.supabase.co/functions/v1/betting-api';
const n=v=>Number.isFinite(Number(v))?Number(v):0;
const fmt=v=>v==null||!Number.isFinite(Number(v))?'—':Number(v).toFixed(2);
const pct=v=>v==null||!Number.isFinite(Number(v))?'—':(100*Number(v)).toFixed(1)+'%';
const roundHalfUp=v=>Math.floor(Number(v)+.5);
const tol=x=>Math.max(1,roundHalfUp(.2*n(x.expected_points)));
const good=x=>!!x.actual&&(n(x.actual.total_points)>=n(x.expected_points)-tol(x));
const err=x=>x.actual?n(x.actual.total_points)-n(x.expected_points):null;
const dateTxt=v=>v?new Date(v).toLocaleString():'—';
let DATA=null,BET=null,BET_ERROR=null,ACTIVE=new URLSearchParams(location.search).get('tab')||'overview',AUDIT_PAGE=1,AUDIT_QUERY='';
const qs=new URLSearchParams(location.search),reqGw=Number(qs.get('gw')||0);
const el=id=>document.getElementById(id);
function closeModal(){el('modal').classList.remove('open')}
function setTab(t){ACTIVE=t;AUDIT_PAGE=1;const u=new URL(location.href);u.searchParams.set('tab',t);history.replaceState({},'',u);render()}
function fixtureResult(id){return (DATA?.fixture_results||[]).find(x=>Number(x.match_id)===Number(id))||null}
function normF(f){const p=f?.prediction||f||{},r=fixtureResult(f?.match_id);return {...f,home_lambda:p.home_lambda??f?.home_lambda,away_lambda:p.away_lambda??f?.away_lambda,confidence:p.confidence??f?.confidence,top_scorelines:p.top_scorelines||f?.top_scorelines||[],markets:p.markets||f?.markets||{},actual_fixture:r}}
function topScore(f){const x=(f?.top_scorelines||[])[0];return x?{score:x.score||x.selection||'—',prob:x.prob??x.probability??null}:null}
function actualScore(r){return r?.finished&&r.home_score!=null&&r.away_score!=null?`${r.home_score}-${r.away_score}`:'Pending'}
function expectedHit(r){return !!(r?.finished&&r?.prediction?.top_scoreline&&r.home_score!=null&&r.away_score!=null&&r.prediction.top_scoreline===`${r.home_score}-${r.away_score}`)}
function openPlayer(id){const x=[...(DATA?.squad||[]),...(DATA?.top_double_digit||[]),...(DATA?.all_predictions||[])].find(p=>Number(p.id)===Number(id));if(!x)return;const a=x.actual||null;el('detail').innerHTML=`<h2 style="font-size:22px">${x.name}</h2><div class="muted">${x.team||'—'} · ${x.position||'—'} · GW${DATA.gameweek}</div><div class="panel"><div class="metric"><span>xPts</span><b>${fmt(x.expected_points)}</b></div><div class="metric"><span>xMin</span><b>${fmt(x.expected_minutes)}</b></div><div class="metric"><span>P10+</span><b>${pct(x.p_10_plus)}</b></div><div class="metric"><span>P15+</span><b>${pct(x.p_15_plus)}</b></div><div class="metric"><span>Model confidence</span><b>${pct(x.confidence)}</b></div>${a?`<div class="metric"><span>Actual points</span><b class="${good(x)?'green':'red'}">${a.total_points}</b></div><div class="metric"><span>Minutes</span><b>${a.minutes}</b></div><div class="metric"><span>Error</span><b class="${good(x)?'green':'red'}">${err(x)>0?'+':''}${fmt(err(x))}</b></div>`:'<div class="metric"><span>Actual</span><b class="muted">Pending</b></div>'}</div>`;el('modal').classList.add('open')}
function openFixture(id){const base=(BET?.fixtures||[]).find(x=>Number(x.match_id)===Number(id))||{match_id:id},f=normF(base),r=fixtureResult(id),scores=(f.top_scorelines||[]).map(x=>`<div class="metric"><span>${x.score||x.selection||'—'}</span><b>${pct(x.prob??x.probability)}</b></div>`).join(''),odds=(f.correct_score_odds||[]).slice(0,16).map(x=>`<div class="metric"><span>${x.bookmaker||'Bookmaker'} · ${x.selection||x.selection_name||'—'}</span><b>${fmt(x.decimal_odds)}</b></div>`).join(''),edges=(f.edge_research?.top_robust_positive_ev||[]).map(x=>`<div class="metric"><span>${x.bookmaker} · ${x.selection_name}</span><b>${fmt(x.decimal_odds)} · EV ${pct(x.expected_value)}</b></div>`).join('');el('detail').innerHTML=`<h2 style="font-size:22px">${f.home_team||r?.home_team||'—'} vs ${f.away_team||r?.away_team||'—'}</h2><div class="muted">${dateTxt(f.kickoff_time||r?.kickoff_time)}</div><div style="margin:10px 0"><span class="tag">xG ${fmt(f.home_lambda)}–${fmt(f.away_lambda)}</span><span class="tag">Confidence ${pct(f.confidence)}</span><span class="status">${r?.finished?'FINISHED':f.frozen?'FROZEN':'PRE-KICKOFF'}</span></div><div class="panel"><div class="metric"><span>Model top score</span><b>${topScore(f)?.score||r?.prediction?.top_scoreline||'—'}</b></div><div class="metric"><span>Actual score</span><b class="${expectedHit(r)?'green':''}">${actualScore(r)}</b></div></div><h2>Top model scorelines</h2><div class="panel">${scores||'<div class="muted">Prediction snapshot unavailable</div>'}</div>${edges?`<h2>Robust positive-EV research</h2><div class="notice">Observational only · model effect disabled</div><div class="panel">${edges}</div>`:''}${odds?`<h2>Bookmaker Correct Score</h2><div class="panel">${odds}</div>`:''}`;el('modal').classList.add('open')}
function renderFixtureTable(){const fs=DATA?.fixture_results||[],rows=fs.map(r=>{const p=r.prediction||null,exp=p?.top_scoreline||'—',actual=actualScore(r),hit=expectedHit(r);return `<tr class="clickrow" onclick="openFixture(${r.match_id})"><td>${r.match_id}</td><td><b>${r.home_short||r.home_team||'—'}–${r.away_short||r.away_team||'—'}</b><small>${dateTxt(r.kickoff_time)}</small></td><td class="score">${exp}<small>${p?.top_scoreline_probability!=null?pct(p.top_scoreline_probability):''}</small></td><td>${p?`${fmt(p.home_lambda)}–${fmt(p.away_lambda)}`:'—'}</td><td class="score ${hit?'green':''}">${actual}</td><td>${r.finished?'Finished':'Pending'}</td></tr>`}).join('');return `<h2>Fixture Predictions vs Actuals · GW${DATA.gameweek}</h2><div class="tablewrap fixtureOnly"><table><thead><tr><th>#</th><th>Fixture</th><th>Expected</th><th>xG</th><th>Actual</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="6">No fixture data.</td></tr>'}</tbody></table></div>`}
function renderOverview(){const d=DATA,s=d.squad||[],map=new Map(s.map(x=>[x.id,x])),xi=(d.decision?.starting_xi||[]).map(x=>map.get(Number(x.id))).filter(Boolean),bench=(d.decision?.bench||[]).map(x=>map.get(Number(x.id))).filter(Boolean),cap=map.get(Number(d.decision?.captain_player_id)),vc=map.get(Number(d.decision?.vice_player_id)),xixp=xi.reduce((z,x)=>z+n(x.expected_points),0),squadxp=s.reduce((z,x)=>z+n(x.expected_points),0);const haul=(d.top_double_digit||[]).map((x,i)=>`<tr class="clickrow" onclick="openPlayer(${x.id})"><td>${i+1}</td><td><b>${x.name}</b><small>${x.team} · ${x.position}</small></td><td class="green">${pct(x.p_10_plus)}</td><td>${pct(x.p_15_plus)}</td><td>${fmt(x.expected_points)}</td><td class="widehide">${n(x.expected_minutes).toFixed(0)}</td><td>${pct(x.confidence)}</td></tr>`).join('');const rows=s.map((x,i)=>`<tr class="${x.actual?(good(x)?'okrow':'badrow'):''} clickrow" onclick="openPlayer(${x.id})"><td>${i+1}</td><td><b>${x.name}</b><small>${x.team} · ${x.position}</small></td><td>${n(x.expected_minutes).toFixed(0)}</td><td>${fmt(x.expected_points)}</td><td>${pct(x.p_10_plus)}</td><td>${pct(x.p_15_plus)}</td><td class="${x.actual?(good(x)?'green':'red'):''}">${x.actual?.total_points??'Pending'}</td></tr>`).join('');return `<div class="cards"><div class="card"><small>Frozen XI xPts</small><b>${fmt(xixp)}</b></div><div class="card"><small>Frozen squad xPts</small><b>${fmt(squadxp)}</b></div><div class="card"><small>Captain / Vice</small><b class="green">${cap?.name||'—'}</b><small>${vc?.name||'—'} vice</small></div><div class="card"><small>Current engine</small><b>${d.current_model_version||'—'}</b></div></div>${renderFixtureTable()}<h2>Top 10 Double-Digit Return Candidates · All 600 Players</h2><div class="tablewrap"><table class="overviewTable"><thead><tr><th>#</th><th>Player</th><th>P10+</th><th>P15+</th><th>xPts</th><th class="widehide">xMin</th><th>Confidence</th></tr></thead><tbody>${haul}</tbody></table></div><h2>Squad Prediction vs Actual</h2><div class="tablewrap"><table class="overviewTable"><thead><tr><th>#</th><th>Player</th><th>xMin</th><th>xPts</th><th>P10+</th><th>P15+</th><th>Actual</th></tr></thead><tbody>${rows}</tbody></table></div><h2>Frozen bench</h2><div class="bench">${bench.map((x,i)=>`<div class="player" onclick="openPlayer(${x.id})"><span>${x.position==='GKP'?'GK':'Bench '+(i+1)}</span><b>${x.name}</b><small>${fmt(x.expected_points)} xPts</small></div>`).join('')}</div>`}
function renderBetting(){if(BET_ERROR)return `<div class="error">Betting API error: ${BET_ERROR}</div>`;const fs=(BET?.fixtures||[]).map(normF),research=fs.flatMap(f=>(f.edge_research?.top_robust_positive_ev||[]).map(x=>({...x,fixture:`${f.home_short||f.home_team}–${f.away_short||f.away_team}`,match_id:f.match_id}))).sort((a,b)=>n(b.expected_value)-n(a.expected_value)),clv=fs.flatMap(f=>(f.clv_research?.top_price_clv||[]).map(x=>({...x,fixture:`${f.home_short||f.home_team}–${f.away_short||f.away_team}`,match_id:f.match_id}))).sort((a,b)=>n(b.price_clv)-n(a.price_clv)),rows=fs.map(f=>{const t=topScore(f),r=fixtureResult(f.match_id);return `<tr class="clickrow" onclick="openFixture(${f.match_id})"><td><b>${f.home_short||f.home_team||'—'}–${f.away_short||f.away_team||'—'}</b></td><td>${t?.score||'—'}<small>${t?pct(t.prob):''}</small></td><td>${actualScore(r)}</td><td>${f.correct_score_count??'—'}</td><td>${f.bookmaker_count??'—'}<small>${(f.bookmakers||[]).join(', ')}</small></td><td>${f.edge_research?.robust_positive_ev_count??0}</td><td>${r?.finished?'Finished':f.frozen?'Frozen':'Pre-KO'}</td></tr>`}).join(''),rr=research.slice(0,30).map(x=>`<tr class="clickrow" onclick="openFixture(${x.match_id})"><td>${x.fixture}</td><td>${x.bookmaker||'—'}</td><td><b>${x.selection_name||x.selection_key||'—'}</b></td><td>${fmt(x.decimal_odds)}</td><td>${pct(x.model_probability)}</td><td class="green">${pct(x.expected_value)}</td><td>${pct(x.min_edge_across_methods)}</td><td>${x.evidence_quality||'—'}</td></tr>`).join(''),cr=clv.slice(0,30).map(x=>`<tr class="clickrow" onclick="openFixture(${x.match_id})"><td>${x.fixture}</td><td>${x.bookmaker||'—'}</td><td>${x.selection_name||x.selection_key||'—'}</td><td>${fmt(x.entry_decimal_odds)}</td><td>${fmt(x.closing_proxy_decimal_odds)}</td><td class="${n(x.price_clv)>0?'green':n(x.price_clv)<0?'red':''}">${pct(x.price_clv)}</td><td>${x.closing_proxy_recency_band||'—'}</td></tr>`).join('');const obs=fs.reduce((z,f)=>z+n(f.edge_research?.observation_count),0),rob=fs.reduce((z,f)=>z+n(f.edge_research?.robust_positive_ev_count),0);return `<div class="notice">Mispricing Intelligence remains observational. <b>model_effect_enabled=false</b>; no research signal is being treated as a betting recommendation.</div><div class="cards"><div class="card"><small>Bookmaker feed</small><b class="${BET?.odds_status==='connected'?'green':'amber'}">${BET?.odds_status||'—'}</b></div><div class="card"><small>Edge observations</small><b>${obs}</b><small>${rob} robust positive-EV</small></div><div class="card"><small>Price tracking</small><b>${BET?.price_tracking_available?'On':'—'}</b></div><div class="card"><small>CLV research</small><b>${BET?.clv_research_available?'On':'Pending'}</b></div></div><h2>Fixture Betting Intelligence · GW${BET?.gameweek||DATA.gameweek}</h2><div class="tablewrap betOnly"><table><thead><tr><th>Fixture</th><th>Model score</th><th>Actual</th><th>CS odds</th><th>Books</th><th>Robust edges</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="7">No fixture snapshots yet.</td></tr>'}</tbody></table></div><h2>Robust positive-EV research observations</h2><div class="muted sectionNote">Two de-vig methods agree; still unvalidated research, not a recommendation.</div><div class="tablewrap betOnly"><table class="research"><thead><tr><th>Fixture</th><th>Book</th><th>Score</th><th>Odds</th><th>Model P</th><th>EV</th><th>Min edge</th><th>Quality</th></tr></thead><tbody>${rr||'<tr><td colspan="8">No robust positive-EV observations in the latest valid snapshots.</td></tr>'}</tbody></table></div><h2>Closing-line value research</h2><div class="muted sectionNote">Only appears after a fixture is frozen and a closing proxy exists.</div><div class="tablewrap betOnly"><table class="research"><thead><tr><th>Fixture</th><th>Book</th><th>Score</th><th>Entry</th><th>Close proxy</th><th>Price CLV</th><th>Close quality</th></tr></thead><tbody>${cr||'<tr><td colspan="7">No finalized CLV observations yet.</td></tr>'}</tbody></table></div>`}
function setAuditSearch(v){AUDIT_QUERY=String(v||'');AUDIT_PAGE=1;render();requestAnimationFrame(()=>{const s=el('auditSearch');if(s){s.focus();const p=s.value.length;s.setSelectionRange(p,p)}})}
function renderAudit(){const all=DATA.all_predictions||[],played=all.filter(x=>x.actual_status==='final'),ok=played.filter(good),bad=played.filter(x=>!good(x)),rate=played.length?100*ok.length/played.length:0,q=AUDIT_QUERY.trim().toLowerCase(),filtered=q?all.filter(x=>`${x.name||''} ${x.team||''} ${x.position||''}`.toLowerCase().includes(q)):all,totalPages=Math.max(1,Math.ceil(filtered.length/20));AUDIT_PAGE=Math.min(Math.max(1,AUDIT_PAGE),totalPages);const start=(AUDIT_PAGE-1)*20,page=filtered.slice(start,start+20),rows=page.map((x,i)=>`<tr class="${x.actual?(good(x)?'okrow':'badrow'):''} clickrow" onclick="openPlayer(${x.id})"><td>${start+i+1}</td><td><b>${x.name}</b><small>${x.team} · ${x.position}</small></td><td>${fmt(x.expected_points)}</td><td class="${x.actual?(good(x)?'green':'red'):''}">${x.actual?.total_points??'Pending'}</td><td class="${x.actual?(good(x)?'green':'red'):''}">${x.actual?(err(x)>0?'+':'')+fmt(err(x)):'—'}</td><td>${pct(x.confidence)}</td></tr>`).join('');return `<div class="cards"><div class="card"><small>Predictions</small><b>${all.length}</b></div><div class="card"><small>Completed</small><b>${played.length}</b></div><div class="card"><small>Successful / better</small><b class="green">${ok.length}</b><small>${rate.toFixed(1)}%</small></div><div class="card"><small>Material underperformance</small><b class="red">${bad.length}</b></div></div><h2>All Predictions vs Actuals · GW${DATA.gameweek}</h2><div class="muted" style="margin-bottom:8px">Green = actual was within downside tolerance or beat prediction. Red = actual materially underperformed prediction.</div><div class="auditSearch"><input id="auditSearch" type="search" value="${AUDIT_QUERY.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}" placeholder="Search player, team or position" aria-label="Search all predictions" oninput="setAuditSearch(this.value)"><span class="muted">${filtered.length} result${filtered.length===1?'':'s'}</span></div><div class="tablewrap auditOnly"><table><thead><tr><th>#</th><th>Player</th><th>xPts</th><th>Actual</th><th>Error</th><th>Confidence</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="muted">No matching predictions.</td></tr>'}</tbody></table></div><div class="pager"><button onclick="auditPage(-1)" ${AUDIT_PAGE===1?'disabled':''}>Previous</button><span>Page ${AUDIT_PAGE} of ${totalPages}</span><button onclick="auditPage(1)" ${AUDIT_PAGE===totalPages?'disabled':''}>Next</button></div>`}
function auditPage(d){AUDIT_PAGE+=d;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){el('tabOverview').classList.toggle('active',ACTIVE==='overview');el('tabBetting').classList.toggle('active',ACTIVE==='betting');el('tabAudit').classList.toggle('active',ACTIVE==='audit');el('app').className='';el('app').innerHTML=ACTIVE==='audit'?renderAudit():ACTIVE==='betting'?renderBetting():renderOverview()}
el('tabOverview').onclick=()=>setTab('overview');el('tabBetting').onclick=()=>setTab('betting');el('tabAudit').onclick=()=>setTab('audit');el('closeModalBtn').onclick=closeModal;el('modal').onclick=e=>{if(e.target===el('modal'))closeModal()};
(async()=>{try{const r=await fetch(API+(reqGw?'?gw='+reqGw:''),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||`FPL API ${r.status}`);DATA=d;try{const br=await fetch(BETAPI+'?gw='+d.gameweek,{cache:'no-store'}),bd=await br.json();if(!br.ok||!bd.ok)throw Error(bd.error||`Betting API ${br.status}`);BET=bd}catch(e){BET=null;BET_ERROR=e instanceof Error?e.message:String(e)}el('gw').innerHTML=(d.available_gameweeks||[]).map(x=>`<option value="${x.gameweek}" ${x.gameweek===d.gameweek?'selected':''}>GW${x.gameweek}</option>`).join('');el('gw').onchange=()=>{const u=new URL(location.href);u.searchParams.set('gw',el('gw').value);location.href=u};el('sub').textContent=`FPL Engine · frozen v${d.model_version} · current v${d.current_model_version||'—'} · GW${d.gameweek}`;el('stamp').textContent=new Date(d.result_run?.observed_at||d.generated_at).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});render()}catch(e){el('app').className='error';el('app').textContent='Dashboard error: '+(e instanceof Error?e.message:String(e))}})();
</script>
</body>
</html>
