<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Football Intelligence</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf2ff;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}.muted,small{color:#8fa6c4}h1{font-size:22px;margin:0}h2{font-size:16px;margin:22px 0 10px}.pill,select{background:#12233a;color:#eaf2ff;border:1px solid #223b5b;border-radius:10px;padding:8px 10px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.card,.panel{background:#0e1b2d;border:1px solid #1c3554;border-radius:14px;padding:13px}.card b{font-size:20px;display:block;margin-top:4px}.green{color:#5ee6a8}.amber{color:#ffd166}.red{color:#ff8f8f}.pitch{background:linear-gradient(180deg,#123c31,#0d3228);border:1px solid #245c4b;border-radius:18px;padding:13px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.player{background:#0c211bcc;border:1px solid #285b4c;border-radius:11px;padding:9px;cursor:pointer}.player span{font-size:10px;color:#86cab0;display:block}.player b{display:block;font-size:13px;margin:2px 0}.player small{font-size:10px}.bench{display:flex;gap:8px;overflow:auto}.bench .player{min-width:145px;background:#151d2b;border-color:#293b53}.notice,.oknote{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:11px}.notice{background:#302515;border:1px solid #5d4821;color:#ffd98c}.oknote{background:#102b24;border:1px solid #245c4b;color:#87e5bf}table{width:100%;border-collapse:collapse;background:#0e1b2d;border-radius:14px;overflow:hidden;font-size:12px}th,td{padding:9px 7px;border-bottom:1px solid #182e49;text-align:right}th:nth-child(2),td:nth-child(2){text-align:left}td small{display:block;font-size:9px;margin-top:2px}.actual{color:#5ee6a8}.toolbar{display:flex;gap:8px;align-items:center}.clickrow{cursor:pointer}.metric{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #182e49}.metric:last-child{border-bottom:0}.loading{padding:32px 0;color:#8fa6c4}.error{padding:14px;background:#3a1717;border:1px solid #6b2d2d;border-radius:12px;color:#ffb2b2;margin-top:18px}@media(min-width:700px){.pitch{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(4,1fr)}}@media(max-width:520px){.widehide{display:none}}</style></head><body><div class="wrap"><div class="top"><div><h1>Football Intelligence</h1><div class="muted" id="sub">Loading engine…</div></div><div class="toolbar"><select id="gw"></select><div class="pill" id="stamp">—</div></div></div><div id="app" class="loading">Loading gameweek snapshot…</div></div><script>const API='https://knooiwezzsxcwhtjtdap.supabase.co/functions/v1/fpl-api',pct=v=>(100*Number(v||0)).toFixed(1)+'%',n=v=>Number(v||0),qs=new URLSearchParams(location.search),reqGw=Number(qs.get('gw')||0),util=x=>n(x.expected_points)+1.5*n(x.p_10_plus)+4*n(x.p_15_plus)+7*n(x.p_20_plus)+.35*n(x.p_start)+.2*n(x.confidence);(async()=>{try{const r=await fetch(API+(reqGw?'?gw='+reqGw:''),{cache:'no-store'}),d=await r.json();if(!d.ok)throw Error(d.error);const sel=document.getElementById('gw');sel.innerHTML=d.available_gameweeks.map(x=>`<option value="${x.gameweek}" ${x.gameweek===d.gameweek?'selected':''}>GW${x.gameweek}</option>`).join('');sel.onchange=()=>location.search='?gw='+sel.value;document.getElementById('sub').textContent=`FPL Engine · frozen v${d.model_version} · current v${d.current_model_version||'—'} · GW${d.gameweek}`;document.getElementById('stamp').textContent=new Date(d.generated_at).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});const s=d.squad,map=new Map(s.map(x=>[x.id,x]));let xi=(d.decision?.starting_xi||[]).map(x=>map.get(Number(x.id))).filter(Boolean),bench=(d.decision?.bench||[]).map(x=>map.get(Number(x.id))).filter(Boolean),cap=map.get(Number(d.decision?.captain_player_id)),vc=map.get(Number(d.decision?.vice_player_id));const xixp=xi.reduce((z,x)=>z+n(x.expected_points),0),squadxp=s.reduce((z,x)=>z+n(x.expected_points),0);const haul=(d.top_double_digit||[]).map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.name}</b><small>${x.team} · ${x.position}</small></td><td><b class="green">${pct(x.p_10_plus)}</b></td><td>${pct(x.p_15_plus)}</td><td>${pct(x.p_20_plus)}</td><td>${n(x.expected_points).toFixed(2)}</td><td class="widehide">${n(x.expected_minutes).toFixed(0)}</td></tr>`).join('');const rows=[...s].sort((a,b)=>util(b)-util(a)).map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.name}</b><small>${x.team} · ${x.position}</small></td><td>${n(x.expected_minutes).toFixed(0)}</td><td>${n(x.expected_points).toFixed(2)}</td><td>${pct(x.p_10_plus)}</td><td>${pct(x.p_15_plus)}</td><td>${x.actual?.total_points??'Pending'}</td></tr>`).join('');document.getElementById('app').className='';document.getElementById('app').innerHTML=`<div class="cards"><div class="card"><small>Frozen XI xPts</small><b>${xixp.toFixed(2)}</b></div><div class="card"><small>Frozen squad xPts</small><b>${squadxp.toFixed(2)}</b></div><div class="card"><small>Captain / Vice</small><b class="green">${cap?.name||'—'}</b><small>${vc?.name||'—'} vice</small></div><div class="card"><small>Current engine</small><b class="amber">v${d.current_model_version||'—'}</b><small>league-wide haul scan</small></div></div><h2>Top 10 Double-Digit Return Candidates · All 600 Players</h2><div class="muted" style="margin-bottom:8px">Ranked by P(10+), then P(15+) and xPts · current engine v${d.current_model_version||'—'}</div><table><thead><tr><th>#</th><th>Player</th><th>P10+</th><th>P15+</th><th>P20+</th><th>xPts</th><th class="widehide">xMin</th></tr></thead><tbody>${haul||'<tr><td colspan="7">No current-engine run for this GW.</td></tr>'}</tbody></table><h2>Squad Prediction vs Actual</h2><table><thead><tr><th>#</th><th>Player</th><th>xMin</th><th>xPts</th><th>P10+</th><th>P15+</th><th>Actual</th></tr></thead><tbody>${rows}</tbody></table><h2>Frozen bench</h2><div class="bench">${bench.map((x,i)=>`<div class="player"><span>${x.position==='GKP'?'GK':'Bench '+(i+1)}</span><b>${x.name}</b><small>${n(x.expected_points).toFixed(2)} xPts · ${pct(x.p_10_plus)} P10+</small></div>`).join('')}</div>`}catch(e){document.getElementById('app').className='error';document.getElementById('app').textContent='Dashboard error: '+e.message}})();</script></body></html>
