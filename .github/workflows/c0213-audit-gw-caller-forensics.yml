name: C0213 audit-gw Caller Forensics

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/c0213-audit-gw-caller-forensics.yml

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: knooiwezzsxcwhtjtdap

jobs:
  trace-caller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query current audit-gw request history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN missing"; exit 1; }

          project="$(curl --fail-with-body -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}")"
          test "$(jq -r '.ref // empty' <<<"$project")" = "$SUPABASE_PROJECT_REF" || { echo "Project identity mismatch"; exit 1; }

          logs_url="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/analytics/endpoints/logs"
          sql="select timestamp, log_attributes['request.pathname'] as pathname, log_attributes['request.method'] as method, log_attributes['response.status_code'] as status_code, log_attributes['request.headers.user_agent'] as user_agent, log_attributes['request.headers.x_client_info'] as x_client_info, log_attributes['request.headers.referer'] as referer, log_attributes['request.host'] as host, log_attributes['function_id'] as function_id from logs where source = 'function_edge_logs' and log_attributes['request.pathname'] = '/functions/v1/audit-gw' and log_attributes['request.method'] != 'OPTIONS' order by timestamp"

          query_window() {
            local start="$1" end="$2" label="$3"
            local file code response err ok=0
            file="$(mktemp)"
            for attempt in 1 2 3 4 5; do
              code="$(curl -sS -o "$file" -w '%{http_code}' --get \
                -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                --data-urlencode "sql=${sql}" \
                --data-urlencode "iso_timestamp_start=${start}" \
                --data-urlencode "iso_timestamp_end=${end}" \
                "$logs_url")"
              if [ "$code" = 200 ]; then ok=1; break; fi
              if [ "$code" = 429 ]; then sleep $((attempt*15)); continue; fi
              echo "HTTP $code for $label"; cat "$file"; rm -f "$file"; exit 1
            done
            test "$ok" -eq 1 || { echo "Rate limit did not clear for $label"; rm -f "$file"; exit 1; }
            response="$(cat "$file")"; rm -f "$file"
            err="$(jq -r '.error // empty' <<<"$response")"
            test -z "$err" || { echo "$err"; exit 1; }
            echo "WINDOW|${label}|${start}|${end}|count=$(jq '.result | length' <<<"$response")"
            jq -r '.result[]? | [.timestamp,.pathname,.method,(.status_code|tostring),(.user_agent // ""),(.x_client_info // ""),(.referer // ""),(.host // ""),(.function_id // "")] | @tsv' <<<"$response"
          }

          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "CALLER_FORENSICS_BEGIN"
          query_window "2026-09-06T00:00:00Z" "2026-09-07T00:00:00Z" "SEP06"
          sleep 8
          query_window "2026-09-07T00:00:00Z" "$now" "SEP07_CURRENT"
          echo "CALLER_FORENSICS_END"
          echo "OBSERVED_AT=${now}"
          echo "No functions were deleted by this workflow."
