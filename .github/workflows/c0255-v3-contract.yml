name: C0255 V3 contract and build

on:
  push:
    branches:
      - c0255-v3-product-semantic-architecture
    paths:
      - 'frontend-v3/**'
      - 'runtime-manifests/fpl-v3-workspace-api.production.json'
      - '.github/workflows/c0255-v3-contract.yml'
  pull_request:
    paths:
      - 'frontend-v3/**'
      - 'runtime-manifests/fpl-v3-workspace-api.production.json'
      - '.github/workflows/c0255-v3-contract.yml'

permissions:
  contents: read

jobs:
  semantic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run V3 semantic regression contract
        run: npm run test:contract

  app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install V3 dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck V3
        run: npm run typecheck
      - name: Build V3
        run: npm run build
      - name: Export generated V3 lockfile
        uses: actions/upload-artifact@v4
        with:
          name: c0255-v3-package-lock
          path: frontend-v3/package-lock.json
          if-no-files-found: error
          retention-days: 1

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install V3 dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build V3
        run: npm run build
      - name: Run responsive semantic E2E and accessibility QA
        run: npm run test:e2e
      - name: Upload browser QA report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: c0255-v3-playwright-report
          path: frontend-v3/playwright-report
          if-no-files-found: ignore
          retention-days: 7
