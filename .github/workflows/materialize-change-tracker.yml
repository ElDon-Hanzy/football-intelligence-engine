name: Materialize change tracker workbook

on:
  push:
    branches: [main]
    paths:
      - 'project-management/.tracker-transfer/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild workbook binary
        shell: bash
        run: |
          set -euo pipefail
          cat project-management/.tracker-transfer/gzpart*.b64 | base64 --decode | gunzip > project-management/FOOTBALL_INTELLIGENCE_CHANGE_TRACKER.xlsx
          unzip -t project-management/FOOTBALL_INTELLIGENCE_CHANGE_TRACKER.xlsx
      - name: Commit workbook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-management/FOOTBALL_INTELLIGENCE_CHANGE_TRACKER.xlsx
          if git diff --cached --quiet; then
            echo 'Workbook already materialized.'
            exit 0
          fi
          git commit -m 'Add football intelligence change tracker workbook'
          git push
