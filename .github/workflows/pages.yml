name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install UI v2 dependencies
        working-directory: frontend-v2
        run: npm ci --no-audit --no-fund

      - name: Typecheck UI v2
        working-directory: frontend-v2
        run: npm run typecheck

      - name: Unit test UI v2
        working-directory: frontend-v2
        run: npm test

      - name: Build UI v2
        working-directory: frontend-v2
        run: npm run build

      - name: Enforce UI v2 bundle budget
        working-directory: frontend-v2
        run: npm run budget

      - name: Install Chromium for UI v2 E2E
        working-directory: frontend-v2
        run: npx playwright install --with-deps chromium

      - name: E2E and accessibility smoke UI v2
        working-directory: frontend-v2
        run: npm run test:e2e

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'frontend-v2/' \
            --exclude '_site/' \
            --exclude 'node_modules/'
          mkdir -p _site/v2
          cp -R frontend-v2/dist/. _site/v2/

      - name: Verify Pages artifact and legacy rollback
        working-directory: frontend-v2
        run: npm run artifact:verify

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed legacy root and v2 entrypoint
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ROOT_URL="${PAGE_URL%/}/"
          V2_URL="${PAGE_URL%/}/v2/"

          fetch_with_retry() {
            local url="$1"
            local destination="$2"
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --location "$url" --output "$destination"; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          fetch_with_retry "$ROOT_URL" /tmp/pages-root.html
          fetch_with_retry "$V2_URL" /tmp/pages-v2.html

          cmp -s index.html /tmp/pages-root.html || {
            echo "C0175 deployment integrity failure: live legacy root differs from repository index.html"
            exit 1
          }
          cmp -s frontend-v2/dist/index.html /tmp/pages-v2.html || {
            echo "C0175 deployment integrity failure: live /v2/ index differs from built dist/index.html"
            exit 1
          }

          V2_JS_ASSET="$(grep -oE '\./assets/[^\"]+\.js' /tmp/pages-v2.html | head -n 1)"
          test -n "$V2_JS_ASSET" || {
            echo "C0175 deployment integrity failure: live /v2/ index has no JavaScript asset reference"
            exit 1
          }
          fetch_with_retry "${V2_URL}${V2_JS_ASSET#./}" /tmp/pages-v2.js
          test -s /tmp/pages-v2.js || {
            echo "C0175 deployment integrity failure: live /v2/ JavaScript asset is empty"
            exit 1
          }

          if curl --fail --silent --location "${ROOT_URL}frontend-v2/package.json" --output /dev/null; then
            echo "C0175 deployment integrity failure: frontend-v2 source is publicly deployed"
            exit 1
          fi

          echo "C0175 live deployment integrity verified"
