<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Football Intelligence</title><style>*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:#07111f;color:#eaf2ff;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{width:100%;max-width:1100px;margin:auto;padding:18px;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}.muted,small{color:#8fa6c4}h1{font-size:22px;margin:0}h2{font-size:16px;margin:22px 0 10px}.pill,select,input,.tab{background:#12233a;color:#eaf2ff;border:1px solid #223b5b;border-radius:10px;padding:8px 10px;font-size:12px}.tabs{display:flex;gap:8px;margin-top:14px;max-width:100%;overflow:auto}.tab{cursor:pointer;white-space:nowrap}.tab.active{background:#1d3858;border-color:#4b77a8}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}.card,.panel,.betcard{background:#0e1b2d;border:1px solid #1c3554;border-radius:14px;padding:13px;min-width:0}.card b{font-size:20px;display:block;margin-top:4px}.betgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.betcard{cursor:pointer}.betcard strong{display:block;font-size:22px;margin:5px 0}.green{color:#5ee6a8}.amber{color:#ffd166}.red{color:#ff6b6b}.player{background:#151d2b;border:1px solid #293b53;border-radius:11px;padding:9px;cursor:pointer;min-width:145px}.player span{font-size:10px;color:#86cab0;display:block}.player b{display:block;font-size:13px;margin:2px 0}.player small{font-size:10px}.bench{display:flex;gap:8px;overflow:auto;max-width:100%}.tablewrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}table{width:100%;max-width:100%;table-layout:fixed;border-collapse:collapse;background:#0e1b2d;font-size:11px}th,td{padding:8px 4px;border-bottom:1px solid #182e49;text-align:right;overflow:hidden;text-overflow:ellipsis}th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal;word-break:break-word}td small{display:block;font-size:8px;margin-top:2px;white-space:normal}.clickrow{cursor:pointer}.okrow{background:rgba(94,230,168,.035)}.badrow{background:rgba(255,107,107,.04)}.toolbar{display:flex;gap:8px;align-items:center}.metric{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #182e49}.tag{display:inline-block;padding:3px 7px;border:1px solid #2a4666;border-radius:999px;font-size:10px;margin:2px 4px 2px 0}.status{display:inline-block;padding:3px 7px;border-radius:999px;font-size:10px;background:#302515;color:#ffd98c;border:1px solid #5d4821}.modal{display:none;position:fixed;inset:0;background:#000a;z-index:50;padding:14px;overflow:auto}.modal.open{display:block}.sheet{max-width:720px;margin:30px auto;background:#0b1727;border:1px solid #294567;border-radius:18px;padding:16px}.close{float:right;background:#172942;color:#fff;border:1px solid #315274;border-radius:10px;padding:6px 9px}.loading{padding:32px 0;color:#8fa6c4}.error{padding:14px;background:#3a1717;border:1px solid #6b2d2d;border-radius:12px;color:#ffb2b2;margin-top:18px}.notice{padding:10px;background:#142338;border:1px solid #284565;border-radius:10px;color:#a9bfd9}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}@media(min-width:700px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}table{font-size:12px}}@media(max-width:520px){.wrap{padding:12px}.widehide{display:none}.overviewTable th:first-child,.overviewTable td:first-child{width:7%}.overviewTable th:nth-child(2),.overviewTable td:nth-child(2){width:30%}.auditOnly,.betOnly{overflow-x:auto}.auditOnly table{min-width:720px;table-layout:auto}.betOnly table{min-width:620px;table-layout:auto}.toolbar{width:100%;justify-content:space-between}.betgrid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>Football Intelligence</h1><div class="muted" id="sub">Loading engine…</div></div><div class="toolbar"><select id="gw"></select><div class="pill" id="stamp">—</div></div></div><div class="tabs"><button id="tabOverview" class="tab">Overview</button><button id="tabBetting" class="tab">Betting</button><button id="tabAudit" class="tab">All Predictions vs Actuals</button></div><div id="app" class="loading">Loading gameweek snapshot…</div></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">Close</button><div id="detail"></div></div></div><script>const API='https://knooiwezzsxcwhtjtdap.supabase.co/functions/v1/fpl-api',BETAPI='https://knooiwezzsxcwhtjtdap.supabase.co/functions/v1/betting-api';const n=v=>Number.isFinite(Number(v))?Number(v):0,fmt=v=>v==null||!Number.isFinite(Number(v))?'—':Number(v).toFixed(2),pct=v=>(100*n(v)).toFixed(1)+'%',safe=(o,p,d=null)=>p.split('.').reduce((a,k)=>a&&a[k]!=null?a[k]:null,o)??d;let DATA=null,BET=null,ACTIVE=new URLSearchParams(location.search).get('tab')||'overview';const qs=new URLSearchParams(location.search),reqGw=Number(qs.get('gw')||0);function closeModal(){modal.classList.remove('open')}function setTab(t){ACTIVE=t;const u=new URL(location.href);u.searchParams.set('tab',t);history.replaceState({},'',u);render()}function normF(f){const p=f.prediction||f;return {...f,home_lambda:p.home_lambda??f.home_lambda,away_lambda:p.away_lambda??f.away_lambda,confidence:p.confidence??f.confidence,top_scorelines:p.top_scorelines||f.top_scorelines||[],markets:p.markets||f.markets||{},market_picks:f.market_picks||p.market_picks||null,history:f.history||[]}}function openPlayer(id){const x=[...(DATA?.squad||[]),...(DATA?.top_double_digit||[]),...(DATA?.all_predictions||[])].find(p=>Number(p.id)===Number(id));if(!x)return;const a=x.actual||null,err=a?n(a.total_points)-n(x.expected_points):null,tol=Math.max(2,.3*n(x.expected_points));detail.innerHTML=`<h2 style="font-size:22px">${x.name}</h2><div class="muted">${x.team||'—'} · ${x.position||'—'} · GW${DATA.gameweek}</div><div class="panel"><div class="metric"><span>xPts</span><b>${fmt(x.expected_points)}</b></div><div class="metric"><span>xMin</span><b>${fmt(x.expected_minutes)}</b></div><div class="metric"><span>P10+</span><b>${pct(x.p_10_plus)}</b></div><div class="metric"><span>P15+</span><b>${pct(x.p_15_plus)}</b></div><div class="metric"><span>Model confidence</span><b>${pct(x.confidence)}</b></div>${a?`<div class="metric"><span>Actual points</span><b class="${Math.abs(err)<=tol?'green':'red'}">${a.total_points}</b></div>`:'<div class="metric"><span>Actual</span><b class="muted">Pending</b></div>'}</div>`;modal.classList.add('open')}function openFixture(id){const f=normF((BET?.fixtures||[]).find(x=>Number(x.match_id)===Number(id))||{});if(!f.match_id)return;const scores=(f.top_scorelines||[]).map(x=>`<div class="metric"><span>${x.score||x.selection||'—'}</span><b>${pct(x.prob??x.probability)}</b></div>`).join('');const odds=(f.correct_score_odds||[]).slice(0,12).map(x=>`<div class="metric"><span>${x.bookmaker} · ${x.selection}</span><b>${fmt(x.decimal_odds)}</b></div>`).join('');detail.innerHTML=`<h2 style="font-size:22px">${f.home_team} vs ${f.away_team}</h2><div class="muted">${new Date(f.kickoff_time).toLocaleString()}</div><div style="margin:10px 0"><span class="tag">xG ${fmt(f.home_lambda)}–${fmt(f.away_lambda)}</span><span class="tag">Confidence ${pct(f.confidence)}</span><span class="status">${f.frozen?'FROZEN':'PRE-KICKOFF'}</span></div><div class="panel"><b>Top correct scores</b>${scores||'<div class="muted">Prediction snapshot unavailable</div>'}</div>${odds?`<h2>Bookmaker Correct Score</h2><div class="panel">${odds}</div>`:''}`;modal.classList.add('open')}function scoreCards(){const a=BET?.homepage_correct_score||[];if(!a.length)return'';return `<h2>Correct Score Recommendations</h2><div class="betgrid">${a.map((z,i)=>{const f=normF(z),pick=safe(f,'market_picks.correct_score',null);return `<div class="betcard" onclick="openFixture(${f.match_id})"><small>MODEL PICK ${i+1} · ${f.home_short||''} vs ${f.away_short||''}</small><strong>${pick?.selection||'—'}</strong><div>${pick?pct(pick.prob):'—'} score probability</div><small>xG ${fmt(f.home_lambda)}–${fmt(f.away_lambda)} · confidence ${pct(f.confidence)}</small></div>`}).join('')}</div>`}function renderOverview(){const d=DATA,s=d.squad||[],map=new Map(s.map(x=>[x.id,x])),xi=(d.decision?.starting_xi||[]).map(x=>map.get(Number(x.id))).filter(Boolean),bench=(d.decision?.bench||[]).map(x=>map.get(Number(x.id))).filter(Boolean),cap=map.get(Number(d.decision?.captain_player_id)),vc=map.get(Number(d.decision?.vice_player_id)),xixp=xi.reduce((z,x)=>z+n(x.expected_points),0),squadxp=s.reduce((z,x)=>z+n(x.expected_points),0);const haul=(d.top_double_digit||[]).map((x,i)=>`<tr class="clickrow" onclick="openPlayer(${x.id})"><td>${i+1}</td><td><b>${x.name}</b><small>${x.team} · ${x.position}</small></td><td class="green">${pct(x.p_10_plus)}</td><td>${pct(x.p_15_plus)}</td><td>${fmt(x.expected_points)}</td><td class="widehide">${n(x.expected_minutes).toFixed(0)}</td><td>${pct(x.confidence)}</td></tr>`).join('');const rows=s.map((x,i)=>`<tr class="clickrow" onclick="openPlayer(${x.id})"><td>${i+1}</td><td><b>${x.name}</b><small>${x.team} · ${x.position}</small></td><td>${n(x.expected_minutes).toFixed(0)}</td><td>${fmt(x.expected_points)}</td><td>${pct(x.p_10_plus)}</td><td>${pct(x.p_15_plus)}</td><td>${x.actual?.total_points??'Pending'}</td></tr>`).join('');return `<div class="cards"><div class="card"><small>Frozen XI xPts</small><b>${fmt(xixp)}</b></div><div class="card"><small>Frozen squad xPts</small><b>${fmt(squadxp)}</b></div><div class="card"><small>Captain / Vice</small><b class="green">${cap?.name||'—'}</b><small>${vc?.name||'—'} vice</small></div><div class="card"><small>Current engine</small><b>${d.current_model_version||'—'}</b></div></div>${scoreCards()}<h2>Top 10 Double-Digit Return Candidates · All 600 Players</h2><div class="tablewrap"><table class="overviewTable"><thead><tr><th>#</th><th>Player</th><th>P10+</th><th>P15+</th><th>xPts</th><th class="widehide">xMin</th><th>Confidence</th></tr></thead><tbody>${haul}</tbody></table></div><h2>Squad Prediction vs Actual</h2><div class="tablewrap"><table class="overviewTable"><thead><tr><th>#</th><th>Player</th><th>xMin</th><th>xPts</th><th>P10+</th><th>P15+</th><th>Actual</th></tr></thead><tbody>${rows}</tbody></table></div><h2>Frozen bench</h2><div class="bench">${bench.map((x,i)=>`<div class="player" onclick="openPlayer(${x.id})"><span>${x.position==='GKP'?'GK':'Bench '+(i+1)}</span><b>${x.name}</b><small>${fmt(x.expected_points)} xPts</small></div>`).join('')}</div>`}function renderBetting(){const fs=(BET?.fixtures||[]).map(normF),rows=fs.map(f=>{const p=f.market_picks;return `<tr class="clickrow" onclick="openFixture(${f.match_id})"><td><b>${f.home_short||f.home_team}–${f.away_short||f.away_team}</b></td><td>${fmt(f.home_lambda)}–${fmt(f.away_lambda)}</td><td>${p?.correct_score?.selection||'—'}<small>${p?.correct_score?pct(p.correct_score.prob):''}</small></td><td>${f.correct_score_count||0}</td><td>${f.odds_count||0}</td><td>${f.frozen?'Frozen':'Pre-KO'}</td></tr>`}).join('');return `<div class="notice">Layer 1 bookmaker feed is being integrated. Missing prediction fields now render safely instead of crashing the dashboard.</div><h2>Fixture Intelligence · GW${BET?.gameweek||DATA.gameweek}</h2><div class="tablewrap betOnly"><table><thead><tr><th>Fixture</th><th>xG</th><th>Correct Score</th><th>CS Odds</th><th>All Odds</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="6">No fixture snapshots yet.</td></tr>'}</tbody></table></div>`}function renderAudit(){const all=DATA.all_predictions||[],played=all.filter(x=>x.actual_status==='final'),ok=played.filter(x=>x.acceptable===true),bad=played.filter(x=>x.acceptable===false),rate=played.length?100*ok.length/played.length:0;const rows=all.map((x,i)=>`<tr class="${x.actual?(x.acceptable?'okrow':'badrow'):''} clickrow" onclick="openPlayer(${x.id})"><td>${i+1}</td><td><b>${x.name}</b><small>${x.team} · ${x.position}</small></td><td>${fmt(x.expected_points)}</td><td>${x.actual?.total_points??'Pending'}</td><td>${x.actual?fmt(x.error):'—'}</td><td>${fmt(x.tolerance)}</td><td>${n(x.expected_minutes).toFixed(0)}</td><td>${x.actual?.minutes??'—'}</td><td>${pct(x.confidence)}</td></tr>`).join('');return `<div class="cards"><div class="card"><small>Predictions</small><b>${all.length}</b></div><div class="card"><small>Completed</small><b>${played.length}</b></div><div class="card"><small>Within tolerance</small><b class="green">${ok.length}</b><small>${rate.toFixed(1)}%</small></div><div class="card"><small>Outside tolerance</small><b class="red">${bad.length}</b></div></div><h2>All Predictions vs Actuals · GW${DATA.gameweek}</h2><div class="tablewrap auditOnly"><table><thead><tr><th>#</th><th>Player</th><th>xPts</th><th>Actual</th><th>Error</th><th>Allowed</th><th>xMin</th><th>Actual Min</th><th>Confidence</th></tr></thead><tbody>${rows}</tbody></table></div>`}function render(){tabOverview.classList.toggle('active',ACTIVE==='overview');tabBetting.classList.toggle('active',ACTIVE==='betting');tabAudit.classList.toggle('active',ACTIVE==='audit');app.className='';app.innerHTML=ACTIVE==='audit'?renderAudit():ACTIVE==='betting'?renderBetting():renderOverview()}tabOverview.onclick=()=>setTab('overview');tabBetting.onclick=()=>setTab('betting');tabAudit.onclick=()=>setTab('audit');(async()=>{try{const [r,br]=await Promise.all([fetch(API+(reqGw?'?gw='+reqGw:''),{cache:'no-store'}),fetch(BETAPI+'?gw='+(reqGw||1),{cache:'no-store'})]),d=await r.json(),bd=await br.json();if(!d.ok)throw Error(d.error);DATA=d;BET=bd.ok?bd:{fixtures:[],gameweek:d.gameweek};if(!reqGw&&BET.gameweek!==d.gameweek){const rr=await fetch(BETAPI+'?gw='+d.gameweek,{cache:'no-store'});const x=await rr.json();if(x.ok)BET=x}gw.innerHTML=(d.available_gameweeks||[]).map(x=>`<option value="${x.gameweek}" ${x.gameweek===d.gameweek?'selected':''}>GW${x.gameweek}</option>`).join('');gw.onchange=()=>{const u=new URL(location.href);u.searchParams.set('gw',gw.value);location.href=u};sub.textContent=`FPL Engine · frozen v${d.model_version} · current v${d.current_model_version||'—'} · GW${d.gameweek}`;stamp.textContent=new Date(d.generated_at).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});render()}catch(e){app.className='error';app.textContent='Dashboard error: '+e.message}})();</script></body></html>
