name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend-v2/package-lock.json
            frontend-v3/package-lock.json

      - name: Install UI v2 dependencies
        working-directory: frontend-v2
        run: npm ci --no-audit --no-fund

      - name: Install UI v3 dependencies
        working-directory: frontend-v3
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck UI v2
        working-directory: frontend-v2
        run: npm run typecheck

      - name: Unit test UI v2
        working-directory: frontend-v2
        run: npm test

      - name: Build UI v2
        working-directory: frontend-v2
        run: npm run build

      - name: Enforce UI v2 bundle budget
        working-directory: frontend-v2
        run: npm run budget

      - name: Semantic contract UI v3
        working-directory: frontend-v3
        run: npm run test:contract

      - name: Typecheck UI v3
        working-directory: frontend-v3
        run: npm run typecheck

      - name: Build UI v3
        working-directory: frontend-v3
        run: npm run build

      - name: Enforce V3 serving parity gate
        working-directory: frontend-v3
        run: npm run gate:serving-parity

      - name: Install Chromium for UI E2E
        working-directory: frontend-v2
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t chrome_sources < <(grep -RIl 'dl.google.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if ((${#chrome_sources[@]})); then
            printf 'C0238 disabling hosted-runner Chrome apt source: %s\n' "${chrome_sources[@]}"
            sudo rm -f "${chrome_sources[@]}"
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d' /etc/apt/sources.list
          fi
          if grep -RIl 'dl.google.com/linux/chrome' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null; then
            echo 'C0238 failed to isolate hosted-runner Chrome apt source'
            exit 1
          fi
          npx playwright install --with-deps chromium

      - name: E2E and accessibility smoke UI v2
        working-directory: frontend-v2
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log

      - name: Responsive semantic E2E and accessibility UI v3
        working-directory: frontend-v3
        run: npm run test:e2e

      - name: Preserve E2E diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-log-${{ github.run_attempt }}
          path: |
            frontend-v2/e2e.log
            frontend-v3/playwright-report
          if-no-files-found: ignore
          retention-days: 1

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'frontend-v2/' \
            --exclude 'frontend-v3/' \
            --exclude '_site/' \
            --exclude 'node_modules/'
          mkdir -p _site/v2 _site/v3
          cp -R frontend-v2/dist/. _site/v2/
          cp -R frontend-v3/dist/. _site/v3/

      - name: Verify Pages artifact and V2 rollback isolation
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend-v2 run artifact:verify
          cmp -s index.html _site/index.html || {
            echo 'C0255 Pages artifact failure: legacy root differs from repository index.html'
            exit 1
          }
          cmp -s frontend-v2/dist/index.html _site/v2/index.html || {
            echo 'C0255 Pages artifact failure: V2 build was altered while assembling artifact'
            exit 1
          }
          cmp -s frontend-v3/dist/index.html _site/v3/index.html || {
            echo 'C0255 Pages artifact failure: V3 build was altered while assembling artifact'
            exit 1
          }
          test ! -e _site/frontend-v2 || {
            echo 'C0255 Pages artifact failure: frontend-v2 source is exposed'
            exit 1
          }
          test ! -e _site/frontend-v3 || {
            echo 'C0255 Pages artifact failure: frontend-v3 source is exposed'
            exit 1
          }
          for app in v2 v3; do
            js_asset="$(grep -oE '\./assets/[^\"]+\.js' "_site/$app/index.html" | head -n 1)"
            test -n "$js_asset" || {
              echo "C0255 Pages artifact failure: $app has no JavaScript asset reference"
              exit 1
            }
            test -s "_site/$app/${js_asset#./}" || {
              echo "C0255 Pages artifact failure: $app JavaScript asset is missing or empty"
              exit 1
            }
          done
          echo 'C0255 Pages artifact integrity verified: legacy root + V2 fallback + V3'

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Verify deployed legacy root, V2 fallback and V3 entrypoint
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ROOT_URL="${PAGE_URL%/}/"
          V2_URL="${PAGE_URL%/}/v2/"
          V3_URL="${PAGE_URL%/}/v3/"

          fetch_with_retry() {
            local url="$1"
            local destination="$2"
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --location "$url" --output "$destination"; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          fetch_with_retry "$ROOT_URL" /tmp/pages-root.html
          fetch_with_retry "$V2_URL" /tmp/pages-v2.html
          fetch_with_retry "$V3_URL" /tmp/pages-v3.html

          cmp -s index.html /tmp/pages-root.html || {
            echo 'C0255 deployment integrity failure: live legacy root differs from repository index.html'
            exit 1
          }
          cmp -s frontend-v2/dist/index.html /tmp/pages-v2.html || {
            echo 'C0255 deployment integrity failure: live /v2/ index differs from built V2 dist'
            exit 1
          }
          cmp -s frontend-v3/dist/index.html /tmp/pages-v3.html || {
            echo 'C0255 deployment integrity failure: live /v3/ index differs from built V3 dist'
            exit 1
          }

          for app in v2 v3; do
            eval "APP_URL=\${${app^^}_URL}"
            index_file="/tmp/pages-$app.html"
            js_asset="$(grep -oE '\./assets/[^\"]+\.js' "$index_file" | head -n 1)"
            test -n "$js_asset" || {
              echo "C0255 deployment integrity failure: live /$app/ index has no JavaScript asset reference"
              exit 1
            }
            fetch_with_retry "${APP_URL}${js_asset#./}" "/tmp/pages-$app.js"
            test -s "/tmp/pages-$app.js" || {
              echo "C0255 deployment integrity failure: live /$app/ JavaScript asset is empty"
              exit 1
            }
          done

          if curl --fail --silent --location "${ROOT_URL}frontend-v2/package.json" --output /dev/null; then
            echo 'C0255 deployment integrity failure: frontend-v2 source is publicly deployed'
            exit 1
          fi
          if curl --fail --silent --location "${ROOT_URL}frontend-v3/package.json" --output /dev/null; then
            echo 'C0255 deployment integrity failure: frontend-v3 source is publicly deployed'
            exit 1
          fi

          echo 'C0255 live deployment integrity verified: legacy root + V2 fallback + V3'
