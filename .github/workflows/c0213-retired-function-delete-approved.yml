name: C0213 Delete Approved Retired Functions

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/c0213-retired-function-delete-approved.yml

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: knooiwezzsxcwhtjtdap
  AUDIT_ID: c45d961c-f053-4b18-89c4-478a28f85d80
  AUDIT_VERSION: '3'
  AUDIT_SHA: a9612f244c875f019d887b39b3e0b74e720a2b7b4f370b128e5581d9811415ae
  SYNC_ID: b491fc7f-eecd-4ac5-9354-228671cd8f8e
  SYNC_VERSION: '5'
  SYNC_SHA: 707639a43f3626036fec83f2b833c290f57595c5da2368133203a8c5e0ba5e01
  POST_FIX_START: 2026-09-07T17:12:00Z

jobs:
  delete-approved-retired-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate exact runtimes and fresh silence gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN missing"; exit 1; }

          project="$(curl --fail-with-body -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}")"
          test "$(jq -r '.ref // empty' <<<"$project")" = "$SUPABASE_PROJECT_REF" || { echo "Project identity mismatch"; exit 1; }

          functions="$(curl --fail-with-body -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/functions")"
          audit="$(jq -c '.[] | select(.slug=="audit-gw")' <<<"$functions")"
          sync="$(jq -c '.[] | select(.slug=="sync-gw-results")' <<<"$functions")"
          test -n "$audit" || { echo "audit-gw is already absent; refusing ambiguous delete"; exit 1; }
          test -n "$sync" || { echo "sync-gw-results missing"; exit 1; }

          test "$(jq -r '.id' <<<"$audit")" = "$AUDIT_ID" || { echo "audit-gw UUID drift"; exit 1; }
          test "$(jq -r '.version|tostring' <<<"$audit")" = "$AUDIT_VERSION" || { echo "audit-gw version drift"; exit 1; }
          test "$(jq -r '.ezbr_sha256' <<<"$audit")" = "$AUDIT_SHA" || { echo "audit-gw SHA drift"; exit 1; }
          test "$(jq -r '.status' <<<"$audit")" = ACTIVE || { echo "audit-gw not ACTIVE"; exit 1; }

          test "$(jq -r '.id' <<<"$sync")" = "$SYNC_ID" || { echo "sync-gw-results UUID drift"; exit 1; }
          test "$(jq -r '.version|tostring' <<<"$sync")" = "$SYNC_VERSION" || { echo "sync-gw-results version drift"; exit 1; }
          test "$(jq -r '.ezbr_sha256' <<<"$sync")" = "$SYNC_SHA" || { echo "sync-gw-results SHA drift"; exit 1; }
          test "$(jq -r '.status' <<<"$sync")" = ACTIVE || { echo "sync-gw-results not ACTIVE"; exit 1; }
          echo "Runtime identities verified: sync-gw-results v${SYNC_VERSION}; audit-gw v${AUDIT_VERSION}."

          logs_url="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/analytics/endpoints/logs"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sql="select timestamp, log_attributes['request.pathname'] as pathname, log_attributes['request.method'] as method, log_attributes['response.status_code'] as status_code, log_attributes['request.headers.user_agent'] as user_agent from logs where source = 'function_edge_logs' and log_attributes['request.pathname'] in ('/functions/v1/sync-gw-results','/functions/v1/audit-gw') and log_attributes['request.method'] != 'OPTIONS' order by timestamp"
          file="$(mktemp)"; ok=0
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o "$file" -w '%{http_code}' --get \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              --data-urlencode "sql=${sql}" \
              --data-urlencode "iso_timestamp_start=${POST_FIX_START}" \
              --data-urlencode "iso_timestamp_end=${now}" \
              "$logs_url")"
            if [ "$code" = 200 ]; then ok=1; break; fi
            if [ "$code" = 429 ]; then sleep $((attempt*15)); continue; fi
            echo "HTTP $code querying hosted logs"; cat "$file"; rm -f "$file"; exit 1
          done
          test "$ok" -eq 1 || { echo "Log query rate limit did not clear"; rm -f "$file"; exit 1; }
          response="$(cat "$file")"; rm -f "$file"
          test -z "$(jq -r '.error // empty' <<<"$response")" || { jq -r '.error' <<<"$response"; exit 1; }

          proof_count="$(jq '[.result[]? | select(.pathname == "/functions/v1/sync-gw-results" and ((.user_agent // "") | contains("C0213-Retirement-Proof/1.0")) and .status_code == "200")] | length' <<<"$response")"
          audit_count="$(jq '[.result[]? | select(.pathname == "/functions/v1/audit-gw")] | length' <<<"$response")"
          echo "PRE_DELETE_TRAFFIC|proof_sync=${proof_count}|audit_gw=${audit_count}|start=${POST_FIX_START}|end=${now}"
          test "$proof_count" -ge 1 || { echo "Canonical sync proof missing"; exit 1; }
          test "$audit_count" -eq 0 || { echo "Fresh audit-gw traffic detected; delete blocked"; exit 1; }
          echo "FRESH_SILENCE_GATE=PASS"

      - name: Delete audit-gw and verify exact absence
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/functions/audit-gw"
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' -X DELETE -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "$url")"
          if [ "$code" != 200 ] && [ "$code" != 204 ]; then
            echo "DELETE failed for audit-gw (HTTP $code)"; cat "$body"; rm -f "$body"; exit 1
          fi
          rm -f "$body"

          functions="$(curl --fail-with-body -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/functions")"
          test "$(jq '[.[] | select(.slug=="audit-gw")] | length' <<<"$functions")" = 0 || { echo "audit-gw still deployed after DELETE"; exit 1; }
          sync="$(jq -c '.[] | select(.slug=="sync-gw-results")' <<<"$functions")"
          test "$(jq -r '.id' <<<"$sync")" = "$SYNC_ID" || { echo "sync-gw-results changed during retirement"; exit 1; }
          test "$(jq -r '.version|tostring' <<<"$sync")" = "$SYNC_VERSION" || { echo "sync-gw-results version changed during retirement"; exit 1; }
          test "$(jq -r '.ezbr_sha256' <<<"$sync")" = "$SYNC_SHA" || { echo "sync-gw-results SHA changed during retirement"; exit 1; }
          echo "DELETED_TARGET=audit-gw"
          echo "FINAL_RETIRED_EDGE_ACTIVE_COUNT_TARGET=0"
          echo "Verified: audit-gw absent; canonical sync-gw-results v5 remains deployed."
