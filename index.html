<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Football Intelligence</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf2ff;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}.muted,small{color:#8fa6c4}h1{font-size:22px;margin:0}h2{font-size:16px;margin:22px 0 10px}.pill,select{background:#12233a;color:#eaf2ff;border:1px solid #223b5b;border-radius:10px;padding:8px 10px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.card{background:#0e1b2d;border:1px solid #1c3554;border-radius:14px;padding:13px}.card b{font-size:20px;display:block;margin-top:4px}.green{color:#5ee6a8}.amber{color:#ffd166}.red{color:#ff8f8f}.pitch{background:linear-gradient(180deg,#123c31,#0d3228);border:1px solid #245c4b;border-radius:18px;padding:13px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.player{background:#0c211bcc;border:1px solid #285b4c;border-radius:11px;padding:9px;cursor:pointer}.player span{font-size:10px;color:#86cab0;display:block}.player b{display:block;font-size:13px;margin:2px 0}.player small{font-size:10px}.bench{display:flex;gap:8px;overflow:auto}.bench .player{min-width:145px;background:#151d2b;border-color:#293b53}.notice,.oknote{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:11px}.notice{background:#302515;border:1px solid #5d4821;color:#ffd98c}.oknote{background:#102b24;border:1px solid #245c4b;color:#87e5bf}table{width:100%;border-collapse:collapse;background:#0e1b2d;border-radius:14px;overflow:hidden;font-size:12px}th,td{padding:9px 7px;border-bottom:1px solid #182e49;text-align:right}th:nth-child(2),td:nth-child(2){text-align:left}td small{display:block;font-size:9px;margin-top:2px}.actual{color:#5ee6a8}.toolbar{display:flex;gap:8px;align-items:center}.clickrow{cursor:pointer}.delta{font-weight:700}.delta.up{color:#5ee6a8}.delta.down{color:#ff8f8f}.grid2{display:grid;grid-template-columns:1fr;gap:10px}.panel{background:#0e1b2d;border:1px solid #1c3554;border-radius:14px;padding:13px}.metric{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #182e49}.metric:last-child{border-bottom:0}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;padding:16px;overflow:auto}.modal.open{display:block}.sheet{max-width:700px;margin:30px auto;background:#0b1727;border:1px solid #294567;border-radius:18px;padding:16px}.close{float:right;background:#172942;color:white;border:1px solid #315274;border-radius:10px;padding:6px 9px}.tag{display:inline-block;padding:3px 7px;border:1px solid #2a4666;border-radius:999px;font-size:10px;margin:2px 4px 2px 0}.loading{padding:32px 0;color:#8fa6c4}.error{padding:14px;background:#3a1717;border:1px solid #6b2d2d;border-radius:12px;color:#ffb2b2;margin-top:18px}@media(min-width:700px){.pitch{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:1fr 1fr}}@media(max-width:520px){th:nth-child(6),td:nth-child(6),th:nth-child(8),td:nth-child(8){display:none}}</style></head><body><div class="wrap"><div class="top"><div><h1>Football Intelligence</h1><div class="muted" id="sub">Loading engine…</div></div><div class="toolbar"><select id="gw"></select><div class="pill" id="stamp">—</div></div></div><div id="app" class="loading">Loading gameweek snapshot…</div></div><div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">Close</button><div id="detail"></div></div></div><script>const API='https://knooiwezzsxcwhtjtdap.supabase.co/functions/v1/fpl-api',pct=v=>(100*Number(v||0)).toFixed(1)+'%',n=v=>Number(v||0),qs=new URLSearchParams(location.search),reqGw=Number(qs.get('gw')||0);let DATA=null;const fmt=v=>v==null?'—':Number(v).toFixed(2);const util=x=>n(x.expected_points)+1.5*n(x.p_10_plus)+4*n(x.p_15_plus)+7*n(x.p_20_plus)+0.35*n(x.p_start)+0.20*n(x.confidence);function delta(v,key){if(!v?.knowledge_changes||v.knowledge_changes[key]==null)return '—';const d=Number(v.knowledge_changes[key]);return `<span class="delta ${d>0?'up':d<0?'down':''}">${d>0?'+':''}${d.toFixed(2)}</span>`}function card(x,tag=''){const a=x.actual;return `<div class="player" onclick="openPlayer(${x.id})"><span>${tag||x.position}</span><b>${x.name}</b><small>${n(x.expected_points).toFixed(2)} xPts · ${pct(x.p_15_plus)} 15+${a?` · <span class="actual">${a.total_points} actual</span>`:' · Pending'}</small></div>`}function closeModal(){document.getElementById('modal').classList.remove('open')}function openPlayer(id){const x=DATA.squad.find(p=>p.id===id);if(!x)return;const a=x.actual||{},s=x.state||{};document.getElementById('detail').innerHTML=`<h2 style="font-size:22px;margin:0 0 4px">${x.name}</h2><div class="muted">${x.team} · ${x.position} · GW${DATA.gameweek}</div><div style="margin:10px 0"><span class="tag">${fmt(x.expected_points)} xPts</span><span class="tag">${util(x).toFixed(2)} utility</span><span class="tag">${pct(x.p_15_plus)} P15+</span><span class="tag">${pct(x.p_dc)} DC</span><span class="tag">${pct(x.p_start)} start</span></div><div class="grid2"><div class="panel"><b>Prediction vs actual</b><div class="metric"><span>Minutes</span><span>${fmt(x.expected_minutes)} → <b class="actual">${x.actual_status==='final'?(a.minutes??'—'):'Pending'}</b></span></div><div class="metric"><span>FPL points</span><span>${fmt(x.expected_points)} → <b class="actual">${x.actual_status==='final'?(a.total_points??'—'):'Pending'}</b></span></div><div class="metric"><span>Goal probability / actual</span><span>${pct(x.p_goal)} · ${x.actual_status==='final'?(a.goals??0):'Pending'}</span></div><div class="metric"><span>Assist probability / actual</span><span>${pct(x.p_assist)} · ${x.actual_status==='final'?(a.assists??0):'Pending'}</span></div><div class="metric"><span>DC probability / actual</span><span>${pct(x.p_dc)} · ${x.actual_status==='final'?(a.defensive_contribution??0):'Pending'}</span></div><div class="metric"><span>Bonus</span><span>${pct(x.p_bonus)} · ${x.actual_status==='final'?(a.bonus??0):'Pending'}</span></div></div><div class="panel"><b>Knowledge state</b><div class="metric"><span>xMin</span><span>${fmt(s.expected_minutes)} (${delta(x,'expected_minutes')})</span></div><div class="metric"><span>Start probability</span><span>${pct(s.start_probability)} (${delta(x,'start_probability')})</span></div><div class="metric"><span>xGI/90</span><span>${fmt(s.xgi90)} (${delta(x,'xgi90')})</span></div><div class="metric"><span>xG/90</span><span>${fmt(s.xg90)} (${delta(x,'xg90')})</span></div><div class="metric"><span>xA/90</span><span>${fmt(s.xa90)} (${delta(x,'xa90')})</span></div><div class="metric"><span>CBIT/90</span><span>${fmt(s.cbit90)} (${delta(x,'cbit90')})</span></div><div class="metric"><span>DC probability</span><span>${pct(s.dc_probability)} (${delta(x,'dc_probability')})</span></div><div class="metric"><span>Role / formation</span><span>${s.role||'—'} / ${s.formation||'—'}</span></div></div></div>${!x.previous_state?'<div class="notice">No previous frozen gameweek state. Knowledge deltas begin from GW2.</div>':''}`;document.getElementById('modal').classList.add('open')} (async()=>{try{const r=await fetch(API+(reqGw?`?gw=${reqGw}`:''),{cache:'no-store'});if(!r.ok)throw new Error('API '+r.status);const d=await r.json();if(!d.ok)throw new Error(d.error||'API error');DATA=d;const sel=document.getElementById('gw');sel.innerHTML=d.available_gameweeks.map(x=>`<option value="${x.gameweek}" ${x.gameweek===d.gameweek?'selected':''}>GW${x.gameweek}</option>`).join('');sel.onchange=()=>location.search='?gw='+sel.value;document.getElementById('sub').textContent=`FPL Engine · v${d.model_version} · GW${d.gameweek} · frozen snapshot`;document.getElementById('stamp').textContent=new Date(d.generated_at).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});const s=d.squad,map=new Map(s.map(x=>[x.id,x]));let xi=[],bench=[],cap=null,vc=null;if(d.decision){xi=(d.decision.starting_xi||[]).map(x=>map.get(Number(x.id))).filter(Boolean);bench=(d.decision.bench||[]).map(x=>map.get(Number(x.id))).filter(Boolean);cap=map.get(Number(d.decision.captain_player_id));vc=map.get(Number(d.decision.vice_player_id));}if(!xi.length){xi=[...s].sort((a,b)=>util(b)-util(a)).slice(0,11);bench=s.filter(x=>!xi.some(y=>y.id===x.id));cap=[...xi].sort((a,b)=>util(b)-util(a))[0];vc=[...xi].filter(x=>x.id!==cap.id).sort((a,b)=>util(b)-util(a))[0]}const ord={GKP:0,DEF:1,MID:2,FWD:3};xi.sort((a,b)=>ord[a.position]-ord[b.position]);const xixp=xi.reduce((z,x)=>z+n(x.expected_points),0),xiutil=xi.reduce((z,x)=>z+util(x),0),squadxp=s.reduce((z,x)=>z+n(x.expected_points),0),squadutil=s.reduce((z,x)=>z+util(x),0),ranked=[...s].sort((a,b)=>util(b)-util(a));const rows=ranked.map((x,i)=>{const a=x.actual,err=a?Number(a.total_points)-n(x.expected_points):null;return `<tr class="clickrow" onclick="openPlayer(${x.id})"><td>${i+1}</td><td><b>${x.name}</b><small>${x.team} · ${x.position}</small></td><td>${n(x.expected_minutes).toFixed(0)}</td><td><b>${n(x.expected_points).toFixed(2)}</b></td><td>${util(x).toFixed(2)}</td><td class="actual">${a?.total_points??'Pending'}</td><td class="${err>0?'green':err<0?'red':''}">${err==null?'—':(err>0?'+':'')+err.toFixed(2)}</td><td>${pct(x.p_15_plus)}</td></tr>`}).join('');const changes=[...s].map(x=>({x,d:Math.abs(Number(x.knowledge_changes?.xgi90||0))+Math.abs(Number(x.knowledge_changes?.expected_minutes||0))/90})).filter(z=>z.d>0).sort((a,b)=>b.d-a.d).slice(0,5);const changeHtml=changes.length?changes.map(z=>`<div class="metric"><span onclick="openPlayer(${z.x.id})" style="cursor:pointer"><b>${z.x.name}</b><small>${z.x.team}</small></span><span>xGI90 ${delta(z.x,'xgi90')}<br>xMin ${delta(z.x,'expected_minutes')}</span></div>`).join(''):'<div class="muted">No previous frozen gameweek state yet. This section becomes meaningful from GW2 onward.</div>';const result=d.result_run?`${d.result_run.is_final?'Final':'Live/partial'} results · ${d.result_run.metadata?.finished_fixtures||0}/${d.result_run.metadata?.fixture_count||10} fixtures finished`:'No results snapshot yet';const audit=d.audit?`MAE pts ${n(d.audit.mae_points).toFixed(2)} · MAE mins ${n(d.audit.mae_minutes).toFixed(1)}${d.audit.calibration?.eligible_for_cumulative_backtest?' · counts in calibration':' · excluded from cumulative calibration'}`:'Audit pending';const oldObjective=String(d.decision?.recommendations?.objective||'').includes('expected_points');document.getElementById('app').className='';document.getElementById('app').innerHTML=`<div class="cards"><div class="card"><small>XI mean xPts</small><b>${xixp.toFixed(2)}</b></div><div class="card"><small>XI selection utility</small><b class="amber">${xiutil.toFixed(2)}</b><small>tail + lineup security</small></div><div class="card"><small>Full squad xPts</small><b>${squadxp.toFixed(2)}</b><small>15 players · utility ${squadutil.toFixed(2)}</small></div><div class="card"><small>Captain / Vice</small><b class="green">${cap?.name||'—'}</b><small>${vc?.name||'—'} vice</small></div></div>${oldObjective?'<div class="notice">This historical GW1 XI was frozen under the old mean-xPts optimizer. The new selection_utility_v0.2 is active for future decision snapshots; history is not rewritten.</div>':''}${d.excluded_from_backtest?`<div class="notice">${d.notes||'This snapshot is excluded from predictive backtesting.'}</div>`:''}<div class="oknote">${result}<br>${audit}</div><h2>Frozen model XI</h2><div class="pitch">${xi.map(x=>card(x,x.position+(x.id===cap?.id?' · C':'')+(x.id===vc?.id?' · VC':''))).join('')}</div><h2>Prediction vs actual</h2><table><thead><tr><th>#</th><th>Player</th><th>xMin</th><th>xPts</th><th>Utility</th><th>Actual</th><th>Error</th><th>15+</th></tr></thead><tbody>${rows}</tbody></table><h2>Knowledge changes</h2><div class="panel">${changeHtml}</div><h2>Frozen bench</h2><div class="bench">${bench.map((x,i)=>card(x,x.position==='GKP'?'GK':`Bench ${i+1}`)).join('')}</div>`;}catch(e){document.getElementById('app').className='error';document.getElementById('app').textContent='Dashboard error: '+e.message}})();</script></body></html>
