<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>Football Intelligence</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf2ff;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.muted,small{color:#8fa6c4}h1{font-size:22px;margin:0}h2{font-size:16px;margin:22px 0 10px}.pill{background:#12233a;border:1px solid #223b5b;border-radius:999px;padding:6px 10px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.card{background:#0e1b2d;border:1px solid #1c3554;border-radius:14px;padding:13px}.card b{font-size:20px;display:block;margin-top:4px}.green{color:#5ee6a8}.amber{color:#ffd166}.pitch{background:linear-gradient(180deg,#123c31,#0d3228);border:1px solid #245c4b;border-radius:18px;padding:13px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.player{background:#0c211bcc;border:1px solid #285b4c;border-radius:11px;padding:9px}.player span{font-size:10px;color:#86cab0;display:block}.player b{display:block;font-size:13px;margin:2px 0}.player small{font-size:10px}.bench{display:flex;gap:8px;overflow:auto}.bench .player{min-width:145px;background:#151d2b;border-color:#293b53}.notice{margin-top:14px;padding:10px 12px;border-radius:10px;background:#302515;border:1px solid #5d4821;color:#ffd98c;font-size:11px}table{width:100%;border-collapse:collapse;background:#0e1b2d;border-radius:14px;overflow:hidden;font-size:12px}th,td{padding:9px 7px;border-bottom:1px solid #182e49;text-align:right}th:nth-child(2),td:nth-child(2){text-align:left}td small{display:block;font-size:9px;margin-top:2px}.loading{padding:32px 0;color:#8fa6c4}.error{padding:14px;background:#3a1717;border:1px solid #6b2d2d;border-radius:12px;color:#ffb2b2;margin-top:18px}@media(min-width:700px){.pitch{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(4,1fr)}}@media(max-width:520px){th:nth-child(5),td:nth-child(5),th:nth-child(7),td:nth-child(7){display:none}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>Football Intelligence</h1><div class="muted" id="sub">Loading engine…</div></div><div class="pill" id="stamp">—</div></div>
  <div id="app" class="loading">Loading current model…</div>
</div>
<script>
const API='https://knooiwezzsxcwhtjtdap.supabase.co/functions/v1/fpl-api';
const pct=v=>(100*Number(v||0)).toFixed(1)+'%';
const n=v=>Number(v||0);
function combos(a,k){const o=[];function r(s,p){if(p.length===k){o.push([...p]);return}for(let i=s;i<=a.length-(k-p.length);i++){p.push(a[i]);r(i+1,p);p.pop()}}r(0,[]);return o}
function optimize(squad){
  const gks=squad.filter(x=>x.position==='GKP'), field=squad.filter(x=>x.position!=='GKP'); let best=null;
  for(const g of gks) for(const c of combos(field,10)){
    const count=p=>c.filter(x=>x.position===p).length;
    if(count('DEF')<3||count('DEF')>5||count('MID')<2||count('MID')>5||count('FWD')<1||count('FWD')>3) continue;
    const xi=[g,...c], score=xi.reduce((s,x)=>s+n(x.expected_points),0); if(!best||score>best.score) best={xi,score};
  }
  const xiIds=new Set(best.xi.map(x=>x.id)); const bench=squad.filter(x=>!xiIds.has(x.id));
  const bg=bench.filter(x=>x.position==='GKP'); const bo=bench.filter(x=>x.position!=='GKP').sort((a,b)=>n(b.expected_points)-n(a.expected_points));
  const xp=[...best.xi].sort((a,b)=>n(b.expected_points)-n(a.expected_points)); const tails=[...best.xi].sort((a,b)=>n(b.p_15_plus)-n(a.p_15_plus)||n(b.p_20_plus)-n(a.p_20_plus));
  const score=x=>n(x.expected_points)+5*n(x.p_15_plus)+8*n(x.p_20_plus); const cap=xp.slice(0,5).sort((a,b)=>score(b)-score(a))[0]; const vc=xp.filter(x=>x.id!==cap.id).sort((a,b)=>(n(b.expected_points)+3*n(b.p_15_plus))-(n(a.expected_points)+3*n(a.p_15_plus)))[0];
  return {xi:best.xi,bench:[...bg,...bo],score:best.score,cap,vc,topHaul:tails[0]};
}
function playerCard(x,tag=''){return `<div class="player"><span>${tag||x.position}</span><b>${x.name}</b><small>${n(x.expected_points).toFixed(2)} xPts · ${pct(x.p_15_plus)} 15+</small></div>`}
(async()=>{try{
  const r=await fetch(API,{cache:'no-store'}); if(!r.ok) throw new Error('API '+r.status); const d=await r.json(); if(!d.ok) throw new Error(d.error||'Unknown API error');
  const s=d.squad, o=optimize(s), ord={GKP:0,DEF:1,MID:2,FWD:3}; o.xi.sort((a,b)=>ord[a.position]-ord[b.position]);
  document.getElementById('sub').textContent=`FPL Engine · v${d.model_version} · GW${d.gameweek}`; document.getElementById('stamp').textContent=new Date(d.generated_at).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  const ranked=[...s].sort((a,b)=>n(b.expected_points)-n(a.expected_points));
  const rows=ranked.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.name}</b><small>${x.team} · ${x.position}</small></td><td>${n(x.expected_minutes).toFixed(0)}</td><td><b>${n(x.expected_points).toFixed(2)}</b></td><td>${pct(x.p_10_plus)}</td><td>${pct(x.p_15_plus)}</td><td>${pct(x.p_20_plus)}</td><td>${pct(x.p_dc)}</td></tr>`).join('');
  document.getElementById('app').className=''; document.getElementById('app').innerHTML=`
    <div class="cards"><div class="card"><small>XI xPts</small><b>${o.score.toFixed(2)}</b></div><div class="card"><small>Captain</small><b class="green">${o.cap.name}</b><small>${n(o.cap.expected_points).toFixed(2)} xPts · ${pct(o.cap.p_15_plus)} 15+</small></div><div class="card"><small>Vice</small><b>${o.vc.name}</b><small>${n(o.vc.expected_points).toFixed(2)} xPts</small></div><div class="card"><small>Top haul</small><b class="amber">${o.topHaul.name}</b><small>${pct(o.topHaul.p_15_plus)} 15+</small></div></div>
    ${d.post_deadline_development_run?'<div class="notice">GW1 is a post-deadline development run and excluded from predictive backtesting.</div>':''}
    <h2>Optimized XI</h2><div class="pitch">${o.xi.map(x=>playerCard(x,x.position+(x.id===o.cap.id?' · C':'')+(x.id===o.vc.id?' · VC':''))).join('')}</div>
    <h2>Bench</h2><div class="bench">${o.bench.map((x,i)=>playerCard(x,x.position==='GKP'?'GK':`Bench ${i}`)).join('')}</div>
    <h2>Full 15 ranking</h2><table><thead><tr><th>#</th><th>Player</th><th>xMin</th><th>xPts</th><th>10+</th><th>15+</th><th>20+</th><th>DC</th></tr></thead><tbody>${rows}</tbody></table>`;
}catch(e){document.getElementById('app').className='error';document.getElementById('app').textContent='Dashboard error: '+e.message}})();
</script>
</body>
</html>
