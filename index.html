async function getJson(u){const r=await fetch(u,{cache:'no-store'});let j;try{j=await r.json()}catch{}if(!r.ok||!j?.ok)throw Error(j?.error||`HTTP ${r.status}`);return j}

function topSig(side){return [...(side?.matchup_signals||[])].filter(x=>x.signal_key!=='personnel_disruption'&&num(x.score)!=null).sort((a,b)=>Math.abs(num(b.score)-.5)-Math.abs(num(a.score)-.5))[0]||null}function tone(x){const d=String(x?.direction||'');return d.includes('ATTACK')?'blue':d.includes('DISRUPTION')?'amber':d.includes('DEFENSIVE')?'green':''}

function home(){const d=S.fpl||{},sq=d.squad||[],ids=new Set((d.decision?.starting_xi||[]).map(x=>+x.id)),xi=sq.filter(x=>ids.has(+x.id)),xixp=xi.reduce((z,x)=>z+(num(x.expected_points)||0),0),sxp=sq.reduce((z,x)=>z+(num(x.expected_points)||0),0),cap=sq.find(x=>+x.id===+d.decision?.captain_player_id),vc=sq.find(x=>+x.id===+d.decision?.vice_player_id),fs=allFixtures(),f=fs.find(x=>new Date(x.kickoff_time)>Date.now())||[...fs].reverse().find(x=>x.finished)||fs[0],pulse=f&&typeof f.home_team==='object'?[...(f.home_team?.matchup_signals||[]),...(f.away_team?.matchup_signals||[])].filter(x=>!String(x.direction).includes('BALANCED')).slice(0,4):[],mi=S.market||{};return `${err('fpl')}${err('fixtures')}<div class="grid hero">${heroFixture(f)}<div class="card pad"><div class="cardHead"><div><div class="eyebrow">Decision state</div><h2>FPL snapshot</h2></div><span class="badge blue">${esc(d.model_version||'—')}</span></div><div class="metric"><span>Starting XI xPts</span><b>${fmt(xixp)}</b></div><div class="metric"><span>15-man squad xPts</span><b>${fmt(sxp)}</b></div><div class="metric"><span>Captain</span><b class="blueTxt">${esc(cap?.name||'—')}</b></div><div class="metric"><span>Vice-captain</span><b>${esc(vc?.name||'—')}</b></div><div class="metric"><span>Snapshot</span><b>${dateTxt(d.generated_at)}</b></div></div></div><div class="section grid cols4">${kpi('Current model',esc(d.current_model_version||'—'),'Active forward engine')}${kpi('Fixture signals',(S.fixtures?.fixtures||[]).filter(x=>!x.frozen).reduce((z,x)=>z+(x.home_team?.matchup_signals?.length||0)+(x.away_team?.matchup_signals?.length||0),0)||'—','Pre-kickoff research')}${kpi('Odds status',esc(mi.odds_status||'—'),'Latest valid snapshots')}${kpi('Value status',mi.value_edge_available?'Enabled':'Research','No recommendation threshold')}</div><div class="section grid cols2"><div class="card pad"><div class="cardHead"><div><div class="eyebrow">Intelligence pulse</div><h2>What stands out</h2></div>${rb()}</div><div class="signalList">${pulse.length?pulse.map(sig).join(''):'<div class="empty">No non-balanced pre-kickoff signals.</div>'}</div></div><div class="card pad"><div class="cardHead"><div><div class="eyebrow">Market layer</div><h2>Research health</h2></div></div><div class="metric"><span>Research edges</span><b>${mi.research_edge_available?'Available':'—'}</b></div><div class="metric"><span>Price tracking</span><b>${mi.price_tracking_available?'Available':'—'}</b></div><div class="metric"><span>CLV research</span><b>${mi.clv_research_available?'Available':'—'}</b></div><div class="researchNote">Market research remains observational and does not create recommendations.</div></div></div>`}
function pcard(x){return `<div class="playerCard" data-player="${x.id}"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.team||'—')} · ${esc(x.position||'—')}</div><div class="playerStats"><div><small>xPts</small><b>${fmt(x.expected_points)}</b></div><div><small>P10+</small><b>${pct(x.p_10_plus)}</b></div><div><small>xMin</small><b>${int(x.expected_minutes)}</b></div></div></div>`}
function fpl(){const d=S.fpl;if(!d)return err('fpl')||'<div class="empty">FPL unavailable.</div>';const sq=d.squad||[],cap=sq.find(x=>+x.id===+d.decision?.captain_player_id),vc=sq.find(x=>+x.id===+d.decision?.vice_player_id),xiIds=new Set((d.decision?.starting_xi||[]).map(x=>+x.id)),benchIds=new Set((d.decision?.bench||[]).map(x=>+x.id)),xi=sq.filter(x=>xiIds.has(+x.id)),bench=sq.filter(x=>benchIds.has(+x.id));return `${err('fpl')}<div class="grid cols3">${kpi('Captain',esc(cap?.name||'—'),`P10+ ${pct(cap?.p_10_plus)} · P15+ ${pct(cap?.p_15_plus)}`)}${kpi('Vice-captain',esc(vc?.name||'—'),`P10+ ${pct(vc?.p_10_plus)} · P15+ ${pct(vc?.p_15_plus)}`)}${kpi('Frozen model',esc(d.model_version||'—'),`GW${d.gameweek} decision state`)}</div><div class="section"><div class="sectionTitle"><h2>Starting XI</h2><p>Frozen decision state</p></div><div class="playerGrid">${xi.map(pcard).join('')||'<div class="empty">No XI.</div>'}</div></div><div class="section"><div class="sectionTitle"><h2>Bench</h2><p>Projection context retained</p></div><div class="playerGrid">${bench.map(pcard).join('')||'<div class="empty">No bench.</div>'}</div></div><div class="section card pad"><div class="cardHead"><div><div class="eyebrow">Haul model</div><h2>Top double-digit candidates</h2></div></div><div class="playerGrid">${(d.top_double_digit||[]).slice(0,9).map(pcard).join('')}</div></div>`}
function fcard(f){const n=names(f),h=typeof f.home_team==='object'?f.home_team:null,a=typeof f.away_team==='object'?f.away_team:null,ss=[...(h?.matchup_signals||[]),...(a?.matchup_signals||[])].filter(x=>!String(x.direction).includes('BALANCED')).slice(0,3),p=(S.fpl?.fixture_results||[]).find(x=>+x.match_id===+f.match_id)?.prediction;return `<div class="fixtureCard" data-fixture="${f.match_id}"><div class="fixtureTop"><div class="fixtureTeams">${esc(n.h)} <span class="muted">vs</span> ${esc(n.a)}<small>${dateTxt(f.kickoff_time)}</small></div><div class="fixtureRight"><strong>${f.finished?score(f):(p?.top_scoreline||'Pre-match')}</strong><span class="badge ${f.finished?'green':f.frozen?'amber':'blue'}">${f.finished?'Finished':f.frozen?'Frozen':'Upcoming'}</span></div></div><div class="fixtureSignals">${ss.length?ss.map(x=>`<span class="badge ${tone(x)}">${esc(label(x.direction))}</span>`).join(''):(h||a?'<span class="badge">No material lean</span>':'<span class="badge">No pre-match intelligence</span>')}</div></div>`}
function fixtures(){return `${err('fixtures')}<div class="card pad"><div class="cardHead"><div><div class="eyebrow">Fixture intelligence</div><h2>GW${S.gw} match board</h2></div>${rb()}</div><div class="researchNote">Signals are frozen at kickoff. Historical fixtures without genuine pre-kickoff snapshots remain empty.</div><div class="fixtureList">${allFixtures().map(fcard).join('')||'<div class="empty">No fixtures.</div>'}</div></div>`}
function mcard(f){const e=f.edge_research?.top_robust_positive_ev?.[0],c=f.clv_research?.top_price_clv?.[0];return `<div class="fixtureCard" data-market="${f.match_id}"><div class="fixtureTop"><div class="fixtureTeams">${esc(f.home_team)} <span class="muted">vs</span> ${esc(f.away_team)}<small>${dateTxt(f.kickoff_time)}</small></div><div class="fixtureRight"><strong>${f.bookmaker_count??'—'} books</strong><span class="badge ${f.frozen?'amber':'blue'}">${f.frozen?'Frozen':'Pre-KO'}</span></div></div><div class="fixtureSignals"><span class="badge">CS ${f.correct_score_count??'—'}</span>${e?`<span class="badge amber">Research EV ${pct(e.expected_value)}</span>`:''}${c?`<span class="badge blue">CLV ${pct(c.price_clv)}</span>`:''}</div></div>`}
function market(){const m=S.market;if(!m)return err('market')||'<div class="empty">Market unavailable.</div>';const fs=m.fixtures||[],edges=fs.reduce((z,f)=>z+(f.edge_research?.robust_positive_ev_count||0),0),books=Math.max(0,...fs.map(f=>num(f.bookmaker_count)||0));return `${err('market')}<div class="grid cols4">${kpi('Odds status',esc(m.odds_status||'—'),'Latest valid pre-kickoff snapshots')}${kpi('Max bookmaker coverage',books||'—','Canonical bookmaker families')}${kpi('Robust research edges',edges||'—','Unvalidated observations')}${kpi('Value recommendation','Disabled','Requires forward validation')}</div><div class="section card pad"><div class="cardHead"><div><div class="eyebrow">Market board</div><h2>Correct Score research</h2></div>${rb()}</div><div class="researchNote">A likely score is not automatically a value bet. Edge, movement and CLV remain separate research layers.</div><div class="fixtureList">${fs.map(mcard).join('')||'<div class="empty">No bookmaker data.</div>'}</div></div>`}
function performance(){const d=S.fpl;if(!d)return err('fpl')||'<div class="empty">Performance unavailable.</div>';const rows=d.all_predictions||[],done=rows.filter(x=>x.actual),ok=done.filter(x=>x.acceptable===true),mae=done.length?done.reduce((z,x)=>z+Math.abs(num(x.error)||0),0)/done.length:null,frows=(d.fixture_results||[]).map(f=>{const p=f.prediction,hit=f.finished&&p?.top_scoreline&&`${f.home_score}-${f.away_score}`===p.top_scoreline;return `<tr class="rowclick" data-fixture="${f.match_id}"><td>${esc(f.home_short||f.home_team)}–${esc(f.away_short||f.away_team)}</td><td>${esc(p?.top_scoreline||'—')}</td><td>${p?`${fmt(p.home_lambda)}–${fmt(p.away_lambda)}`:'—'}</td><td class="${hit?'good':''}">${f.finished?`${f.home_score}–${f.away_score}`:'Pending'}</td><td>${hit?'Exact':f.finished?'Miss':'—'}</td></tr>`}).join('');return `${err('fpl')}<div class="grid cols4">${kpi('Final player actuals',done.length||'—','Snapshot-safe finality')}${kpi('Within tolerance',done.length?`${ok.length}/${done.length}`:'—','Decision audit')}${kpi('Mean absolute error',fmt(mae),'Finalized players')}${kpi('Result run',d.result_run?.id??'—',d.result_run?.is_final?'Final':'Partial')}</div><div class="section card pad"><div class="cardHead"><div><div class="eyebrow">Fixture model</div><h2>Predicted vs actual</h2></div></div><div class="tableWrap"><table><thead><tr><th>Fixture</th><th>Top score</th><th>λ</th><th>Actual</th><th>Outcome</th></tr></thead><tbody>${frows}</tbody></table></div></div><div class="section card pad"><div class="cardHead"><div><div class="eyebrow">Player audit</div><h2>All projections</h2></div></div><div class="tableWrap"><table><thead><tr><th>Player</th><th>Team</th><th>xPts</th><th>Actual</th><th>Error</th><th>P10+</th></tr></thead><tbody>${rows.slice(0,80).map(x=>`<tr class="rowclick" data-player="${x.id}"><td>${esc(x.name)}</td><td>${esc(x.team||'—')}</td><td>${fmt(x.expected_points)}</td><td>${x.actual?.total_points??'Pending'}</td><td class="${num(x.error)!=null?(num(x.error)>=0?'good':'bad'):''}">${num(x.error)!=null?(num(x.error)>0?'+':'')+fmt(x.error):'—'}</td><td>${pct(x.p_10_plus)}</td></tr>`).join('')}</tbody></table></div></div>`}
function render(){if(S.loading){el(S.view).innerHTML='<div class="loading">Loading intelligence…</div>';return}el(S.view).innerHTML=({home,fpl,fixtures,market,performance}[S.view])()}
function open(){el('modal').classList.add('open');document.body.style.overflow='hidden'}function close(){el('modal').classList.remove('open');document.body.style.overflow=''}
function playerDetail(id){const x=[...(S.fpl?.squad||[]),...(S.fpl?.top_double_digit||[]),...(S.fpl?.all_predictions||[])].find(p=>+p.id===+id);if(!x)return;el('modalTitle').innerHTML=`<div class="eyebrow">Player intelligence</div><strong>${esc(x.name)}</strong><div class="muted" style="font-size:10px">${esc(x.team||'—')} · ${esc(x.position||'—')}</div>`;const a=x.actual;el('modalBody').innerHTML=`<div class="grid cols3">${kpi('Expected points',fmt(x.expected_points),'Frozen projection')}${kpi('Expected minutes',fmt(x.expected_minutes),'Availability adjusted')}${kpi('P10+',pct(x.p_10_plus),'Haul probability')}</div><div class="section grid cols2"><div class="detailSide"><div class="metric"><span>P(start)</span><b>${pct(x.p_start)}</b></div><div class="metric"><span>P(goal)</span><b>${pct(x.p_goal)}</b></div><div class="metric"><span>P(assist)</span><b>${pct(x.p_assist)}</b></div><div class="metric"><span>P(DC)</span><b>${pct(x.p_dc)}</b></div></div><div class="detailSide">${a?`<div class="metric"><span>Actual points</span><b>${a.total_points}</b></div><div class="metric"><span>Minutes</span><b>${a.minutes}</b></div><div class="metric"><span>Goals</span><b>${a.goals??0}</b></div><div class="metric"><span>Assists</span><b>${a.assists??0}</b></div>`:'<div class="empty">Actual result pending.</div>'}</div></div>`;open()}
const axis=(n,v)=>`<div class="axis"><span>${n}</span><div class="bar"><i style="width:${100*clamp(v)}%"></i></div><b>${fmt(v)}</b></div>`;function profile(s){const p=s?.tactical_profile;if(!p)return '<div class="empty">No genuine pre-kickoff profile.</div>';return axis('Possession',p.possession_control)+axis('Directness',p.directness)+axis('Width',p.width)+axis('Box occupation',p.attacking_box_occupation)+axis('Set piece',p.set_piece)+axis('Defensive block',p.defensive_block)+`<div class="kpiSub">${esc(label(p.style_label))} · confidence ${pct(p.confidence)}</div>`}function xi(s){return `<div class="xiList">${(s?.expected_xi||[]).map(x=>`<div class="xiRow"><div><strong>${esc(x.name)}</strong><small>${esc(x.position||'—')} · ${esc(label(x.role?.primary||'Unresolved'))}</small></div><b>P(start) ${pct(x.p_start)}</b><b>${int(x.xmin)}m</b></div>`).join('')||'<div class="empty">No Expected XI snapshot.</div>'}</div>`}function reps(s){const top=[],seen=new Set();for(const x of s?.replacement_research||[])if(!seen.has(x.target_player_id)){seen.add(x.target_player_id);top.push(x)}return `<div class="signalList">${top.map(x=>`<div class="signal"><div><strong>${esc(x.target_name)} → ${esc(x.candidate_name||'No reliable cover')}</strong><small>${esc(label(x.quality_status))} · ${esc(label(x.candidate_role||'Unknown'))}</small></div><div class="signalScore"><b>${fmt(x.composite_score)}</b><small>${pct(x.confidence)} conf.</small></div></div>`).join('')||'<div class="empty">No material replacement research.</div>'}</div>`}
function fixtureDetail(id){const f=(S.fixtures?.fixtures||[]).find(x=>+x.match_id===+id)||allFixtures().find(x=>+x.match_id===+id);if(!f)return;const n=names(f),h=typeof f.home_team==='object'?f.home_team:null,a=typeof f.away_team==='object'?f.away_team:null;el('modalTitle').innerHTML=`<div class="eyebrow">Fixture intelligence · GW${S.gw}</div><strong>${esc(n.h)} vs ${esc(n.a)}</strong><div class="muted" style="font-size:10px">${dateTxt(f.kickoff_time)} · ${f.finished?'Finished':f.frozen?'Frozen':'Pre-kickoff'}</div>`;let body=S.detailTab==='profiles'?`<div class="detailGrid"><div class="detailSide"><h3>${esc(n.h)}</h3>${profile(h)}</div><div class="detailSide"><h3>${esc(n.a)}</h3>${profile(a)}</div></div>`:S.detailTab==='xi'?`<div class="detailGrid"><div class="detailSide"><h3>${esc(n.h)} Expected XI</h3>${xi(h)}</div><div class="detailSide"><h3>${esc(n.a)} Expected XI</h3>${xi(a)}</div></div>`:S.detailTab==='replacements'?`<div class="detailGrid"><div class="detailSide"><h3>${esc(n.h)}</h3>${reps(h)}</div><div class="detailSide"><h3>${esc(n.a)}</h3>${reps(a)}</div></div>`:`<div class="detailGrid"><div class="detailSide"><h3>${esc(n.h)}</h3><div class="signalList">${(h?.matchup_signals||[]).map(sig).join('')||'<div class="empty">No pre-kickoff signals.</div>'}</div></div><div class="detailSide"><h3>${esc(n.a)}</h3><div class="signalList">${(a?.matchup_signals||[]).map(sig).join('')||'<div class="empty">No pre-kickoff signals.</div>'}</div></div></div>`;el('modalBody').innerHTML=`<div class="researchNote">Observational research only. No exact formation, left/right flank, pressing intensity or line-height claim is made.</div><div class="tabsInline">${[['signals','Matchups'],['profiles','Team style'],['xi','Expected XI'],['replacements','Replacements']].map(x=>`<button class="miniTab ${S.detailTab===x[0]?'active':''}" data-dtab="${x[0]}" data-dfixture="${id}">${x[1]}</button>`).join('')}</div>${body}`;open()}
function marketDetail(id){const f=(S.market?.fixtures||[]).find(x=>+x.match_id===+id);if(!f)return;el('modalTitle').innerHTML=`<div class="eyebrow">Market intelligence</div><strong>${esc(f.home_team)} vs ${esc(f.away_team)}</strong><div class="muted" style="font-size:10px">${dateTxt(f.kickoff_time)}</div>`;const es=f.edge_research?.top_robust_positive_ev||[],mv=f.price_tracking?.top_moves||[],cl=f.clv_research?.top_price_clv||[];el('modalBody').innerHTML=`<div class="researchNote">Research only. No live value recommendation threshold is enabled.</div><div class="grid cols3">${kpi('Bookmakers',f.bookmaker_count??'—','Canonical families')}${kpi('Correct scores',f.correct_score_count??'—','Latest rows')}${kpi('Model λ',f.prediction?`${fmt(f.prediction.home_lambda)}–${fmt(f.prediction.away_lambda)}`:'—','Frozen model')}</div><div class="section grid cols2"><div class="detailSide"><h3>Top research edges</h3>${es.length?es.map(x=>`<div class="metric"><span>${esc(x.bookmaker)} · ${esc(x.selection_name)}</span><b class="amberTxt">EV ${pct(x.expected_value)}</b></div>`).join(''):'<div class="empty">No robust positive-EV rows.</div>'}</div><div class="detailSide"><h3>Price movement</h3>${mv.length?mv.map(x=>`<div class="metric"><span>${esc(x.bookmaker)} · ${esc(x.selection_name)}</span><b>${fmt(x.first_observed_decimal_odds)} → ${fmt(x.latest_decimal_odds)}</b></div>`).join(''):'<div class="empty">No movement history.</div>'}</div></div><div class="section detailSide"><h3>CLV research</h3>${cl.length?cl.map(x=>`<div class="metric"><span>${esc(x.bookmaker)} · ${esc(x.selection_name)}</span><b class="blueTxt">${pct(x.price_clv)}</b></div>`).join(''):'<div class="empty">No CLV observations.</div>'}</div>`;open()}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n)return setView(n.dataset.nav);const p=e.target.closest('[data-player]');if(p)return playerDetail(+p.dataset.player);const f=e.target.closest('[data-fixture]');if(f){S.detailTab='signals';return fixtureDetail(+f.dataset.fixture)}const m=e.target.closest('[data-market]');if(m)return marketDetail(+m.dataset.market);const t=e.target.closest('[data-dtab]');if(t){S.detailTab=t.dataset.dtab;return fixtureDetail(+t.dataset.dfixture)}});el('closeModal').onclick=close;el('modal').onclick=e=>{if(e.target===el('modal'))close()};el('refreshBtn').onclick=()=>load(S.gw);el('gw').onchange=e=>{S.gw=+e.target.value;const u=new URL(location.href);u.searchParams.set('gw',S.gw);history.replaceState({},'',u);load(S.gw)};const q=new URLSearchParams(location.search),legacy={overview:'home',betting:'market',audit:'performance'};S.view=q.get('view')||legacy[q.get('tab')]||'home';S.gw=+(q.get('gw')||1);setView(S.view,false);load(S.gw);
</script></body></html>
