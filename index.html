<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Football Intelligence Engine</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./ui-fixes.css">
  <link rel="stylesheet" href="./ui-v2.css">
  <link rel="stylesheet" href="./ui-v3.css">
  <link rel="stylesheet" href="./ui-v4.css">
  <link rel="stylesheet" href="./ui-v5.css">
  <link rel="stylesheet" href="./ui-v7.css">
  <link rel="stylesheet" href="./ui-v8.css">
  <link rel="stylesheet" href="./ui-v9.css">
  <link rel="stylesheet" href="./ui-v10.css">
  <link rel="stylesheet" href="./ui-v11.css">
  <link rel="stylesheet" href="./ui-v12.css">
  <link rel="stylesheet" href="./ui-v13.css">
  <link rel="stylesheet" href="./ui-v14.css">
  <link rel="stylesheet" href="./ui-v15.css">
  <link rel="stylesheet" href="./ui-v17.css?v=1">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark">FI</div>
        <div><strong>Football Intelligence</strong><span>Decision Engine</span></div>
      </div>
      <nav class="nav-list" id="desktopNav">
        <button class="nav-item active" data-route="home"><span class="nav-glyph">H</span><span>Home</span></button>
        <button class="nav-item" data-route="fpl"><span class="nav-glyph">F</span><span>FPL</span></button>
        <button class="nav-item" data-route="fixtures"><span class="nav-glyph">X</span><span>Fixtures</span></button>
        <button class="nav-item" data-route="market"><span class="nav-glyph">M</span><span>Betting</span></button>
        <button class="nav-item" data-route="performance"><span class="nav-glyph">P</span><span>Performance</span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="research-lock"><span class="status-dot"></span><div><strong>Live maturation</strong><span>Bounded production effects are live; frozen research tracks remain separate for validation</span></div></div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="page-heading"><span class="eyebrow" id="pageEyebrow">Decision engine</span><h1 id="pageTitle">Home</h1></div>
        <div class="top-actions">
          <label class="select-wrap"><span>Gameweek</span><select id="gwSelect" aria-label="Select gameweek"></select></label>
          <div class="freshness"><span class="freshness-dot" id="freshnessDot"></span><div><strong id="dataState">Loading</strong><span id="dataStamp">Fetching engine state…</span></div></div>
        </div>
      </header>
      <main id="app" class="main-content" aria-live="polite">
        <div class="loading-state"><div class="loader"></div><strong>Loading intelligence surfaces</strong><span>FPL, fixtures and market data are being synchronized.</span></div>
      </main>
    </div>
  </div>

  <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation">
    <button class="mobile-nav-item active" data-route="home"><span>H</span><small>Home</small></button>
    <button class="mobile-nav-item" data-route="fpl"><span>F</span><small>FPL</small></button>
    <button class="mobile-nav-item" data-route="fixtures"><span>X</span><small>Fixtures</small></button>
    <button class="mobile-nav-item" data-route="market"><span>M</span><small>Betting</small></button>
    <button class="mobile-nav-item" data-route="performance"><span>P</span><small>Performance</small></button>
  </nav>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="detail-drawer" id="detailDrawer" aria-hidden="true">
    <button class="drawer-close" id="drawerClose" aria-label="Close details">×</button>
    <div id="drawerContent"></div>
  </aside>
  <script src="./app.js" defer></script>
  <script src="./ui-v2.js" defer></script>
  <script src="./ui-v2-hotfix.js" defer></script>
  <script src="./ui-v3.js" defer></script>
  <script src="./ui-v4.js" defer></script>
  <script src="./ui-v5.js" defer></script>
  <script src="./ui-v6.js" defer></script>
  <script src="./ui-v7.js" defer></script>
  <script src="./ui-v8.js" defer></script>
  <script src="./ui-v9.js" defer></script>
  <script src="./ui-v10.js" defer></script>
  <script src="./ui-v11.js" defer></script>
  <script src="./ui-v12.js" defer></script>
  <script src="./ui-v13.js" defer></script>
  <script src="./ui-v14.js" defer></script>
  <script src="./ui-v15.js" defer></script>
  <script src="./ui-v16.js?v=1" defer></script>
  <script src="./ui-v17.js?v=1" defer></script>
</body>
</html>
